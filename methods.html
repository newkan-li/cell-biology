<style>
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:10px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mcard h3{margin:0 0 2px;font-size:15px;color:#1f5c8b;border:0;padding:0}
.mcard .men{font-size:11.5px;color:#6a4a8a}
.mcard .mcat{font-size:11px;color:#fff;background:#5a7fa8;border-radius:20px;padding:1px 8px;margin-left:6px}
.mcard .mrow{font-size:12.6px;color:#33465c;line-height:1.7;margin-top:6px}
.mcard .mrow b{color:#1f5c8b}
.mcard .mlink{display:inline-block;margin-top:8px;font-size:11.5px;text-decoration:none;color:#234f7a;background:#eef4fb;border:1px solid #ccd8ea;border-radius:20px;padding:2px 9px}
html[data-theme="dark"] .mcard{background:#1b2531;border-color:#2c3a4a}
html[data-theme="dark"] .mcard h3{color:#7fb3d8}
html[data-theme="dark"] .mcard .mrow{color:#c9d6e2}
html[data-theme="dark"] .mcard .mrow b{color:#8fc0e6}
</style>

<body data-page="methods">
<div class="wrap">
  <header class="top">
    <h1>🧪 实验方法与技术</h1>
    <p>原理 · 步骤 · 结果判读 · 易错点 ｜ 覆盖分离、成像、分子互作、电生理、检测、细胞工程</p>
  </header>
  <p><a href="index.html">← 返回首页</a> ｜ <a href="experiments.html">🔬 实验一览</a>　<a href="schedule.html">🧭 学习路线</a> ｜ <a href="methods.html">🧪 实验方法</a> ｜ <a href="glossary.html">📖 术语表</a> ｜ <a href="history.html">🕰 科学史</a> ｜ <a href="animations.html">🎬 动画总目录</a></p>
  <div class="fc-chips" id="chips"></div>
  <input id="q" class="ans" placeholder="搜索方法名 / 关键词 …" style="margin-top:6px;width:100%">
  <div id="count" class="hint" style="margin-top:6px"></div>
  <div class="mgrid" id="host"></div>
  <footer style="margin-top:24px">仅供个人学习使用</footer>
</div>
<script src="data/manifest.js?v=20260926o"></script>
<script src="data/methods.js?v=20260926o"></script>
<script>
(function () {
  var ALL = window.METHODS || [];
  var CHN = {}; (window.MANIFEST || []).forEach(function (m) { CHN[m.id] = m.title; });
  var cur = "all", kw = "";
  var chips = document.getElementById("chips"), host = document.getElementById("host"), cnt = document.getElementById("count"), qi = document.getElementById("q");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var cats = []; ALL.forEach(function (m) { if (m.cat && cats.indexOf(m.cat) < 0) cats.push(m.cat); });
  function chip(label, val) { var b = document.createElement("button"); b.className = "fc-chip" + (val === cur ? " on" : ""); b.textContent = label; b.dataset.v = val; b.onclick = function () { cur = val; sync(); render(); }; chips.appendChild(b); }
  chip("全部（" + ALL.length + "）", "all");
  cats.forEach(function (c) { chip(c, c); });
  function sync() { Array.prototype.forEach.call(chips.children, function (b) { b.classList.toggle("on", b.dataset.v === cur); }); }
  qi.oninput = function () { kw = qi.value.trim().toLowerCase(); render(); };
  function render() {
    var list = ALL.filter(function (m) {
      if (cur !== "all" && m.cat !== cur) return false;
      if (kw && (m.t + m.en + m.principle + (m.steps || "") + m.result).toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
    cnt.textContent = "共 " + list.length + " 项方法";
    host.innerHTML = list.map(function (m) {
      var link = (m.kp && CHN[m.kp.split("_")[0]]) ? '<a class="mlink" href="' + m.kp.split("_")[0] + '.html#s_' + esc(m.kp) + '">📄 对应讲义页</a>' : "";
      return '<div class="mcard"><h3>' + esc(m.t) + '<span class="mcat">' + esc(m.cat) + '</span></h3><div class="men">' + esc(m.en || "") + '</div>' +
        '<div class="mrow"><b>原理：</b>' + esc(m.principle) + '</div>' +
        (m.steps ? '<div class="mrow"><b>步骤：</b>' + esc(m.steps) + '</div>' : "") +
        '<div class="mrow"><b>结果/用途：</b>' + esc(m.result) + '</div>' +
        (m.pitfalls ? '<div class="mrow"><b>易错/注意：</b>' + esc(m.pitfalls) + '</div>' : "") + link + '</div>';
    }).join("") || '<p class="empty">没有匹配的方法。</p>';
  }
  render();
})();
</script>
</body>
</html>
