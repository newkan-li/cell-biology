<script>
(function () {
  var ALL = (window.HISTORY || []).slice();
  var CHN = {}; (window.MANIFEST || []).forEach(function (m) { CHN[m.id] = m.title; });
  var cur = "all", kw = "";
  var chips = document.getElementById("chips"), host = document.getElementById("host"), cnt = document.getElementById("count"), qi = document.getElementById("q");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var chs = []; ALL.forEach(function (h) { if (h.ch && chs.indexOf(h.ch) < 0) chs.push(h.ch); });
  chs.sort();
  function chip(label, val) { var b = document.createElement("button"); b.className = "fc-chip" + (val === cur ? " on" : ""); b.textContent = label; b.dataset.v = val; b.onclick = function () { cur = val; sync(); render(); }; chips.appendChild(b); }
  chip("全部（" + ALL.length + "）", "all");
  chs.forEach(function (c) { chip((CHN[c] || c).slice(0, 12), c); });
  function sync() { Array.prototype.forEach.call(chips.children, function (b) { b.classList.toggle("on", b.dataset.v === cur); }); }
  qi.oninput = function () { kw = qi.value.trim().toLowerCase(); render(); };
  function render() {
    var list = ALL.filter(function (h) {
      if (cur !== "all" && h.ch !== cur) return false;
      if (kw && (h.y + h.t + (h.who || "") + h.d).toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
    cnt.textContent = "共 " + list.length + " 条";
    host.innerHTML = list.map(function (h) {
      var link = (h.kp && CHN[h.ch]) ? '<div class="tl-l"><a href="' + h.ch + '.html#s_' + esc(h.kp) + '">📄 对应讲义页：' + esc(CHN[h.ch]) + '</a></div>' : "";
      return '<div class="tl-item"><span class="tl-y">' + esc(h.y) + '</span><span class="tl-t">' + esc(h.t) + '</span>' +
        (h.who ? '<span class="tl-w">' + esc(h.who) + '</span>' : "") +
        '<div class="tl-d">' + esc(h.d) + '</div>' + link + '</div>';
    }).join("") || '<p class="empty">没有匹配的条目。</p>';
  }
  render();
})();
</script>
