<!doctype html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f5c8b">
<title>动画总目录 · 细胞生物学</title>
<link rel="stylesheet" href="assets/style.css?v=20260926ar">
<script src="assets/theme.js?v=20260926ar"></script>
<style>
.anim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:8px}
.anim-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.anim-card .ac-h{font-weight:700;font-size:13px;color:var(--blue);line-height:1.4}
.anim-card .ac-m{font-size:11.5px;color:var(--sub);margin:3px 0 6px}
.anim-card .ac-b{display:flex;gap:6px;flex-wrap:wrap}
.anim-card .ac-b a{font-size:11.5px;text-decoration:none;color:#234f7a;background:#eef4fb;border:1px solid #ccd8ea;border-radius:20px;padding:2px 9px}
.anim-card .ac-b a:hover{background:#dfeaf8}
html[data-theme="dark"] .anim-card{background:#1b2531;border-color:#2c3a4a}
html[data-theme="dark"] .anim-card .ac-h{color:#7fb3d8}
html[data-theme="dark"] .anim-card .ac-b a{background:#22303d;border-color:#33475a;color:#a8c6e0}
</style>
</head>
<body data-page="animations">
<div class="wrap">
  <header class="top">
    <h1>🎬 动画总目录</h1>
    <p>全部动画演示（逐阶段单步 + 文字讲解）｜ 数据存本机，无需联网</p>
  </header>
  <p><a href="index.html">← 返回首页</a> ｜ <a href="faq.html">❓ 常见问题</a> ｜ <a href="guide.html">🚀 上手指南</a> ｜ <a href="report.html">📊 学习报告</a> ｜ <a href="experiments.html">🔬 实验一览</a>　<a href="schedule.html">🧭 学习路线</a> ｜ <a href="animations.html">🎬 动画目录</a> ｜ <a href="history.html">🕰 科学史</a> ｜ <a href="methods.html">🧪 实验方法</a> ｜ <a href="mindmap.html">🕸 跨章总图</a> ｜ <a href="glossary.html">📖 术语表</a></p>

  <div class="fc-chips" id="chips"></div>
  <input id="q" class="ans" placeholder="搜索动画标题 / 章节 …" style="margin-top:6px;width:100%">
  <div id="count" class="hint" style="margin-top:6px"></div>
  <div id="host"></div>
  <footer style="margin-top:24px">仅供个人学习使用</footer>
</div>
<script src="data/manifest.js?v=20260926ar"></script>
<script src="data/animlist.js?v=20260926ar"></script>
<script>
(function () {
  var ALL = window.ANIMLIST || [];
  var cur = "all", kw = "";
  var byCh = {};
  ALL.forEach(function (a) { (byCh[a.ch] = byCh[a.ch] || []).push(a); });
  var chips = document.getElementById("chips"), host = document.getElementById("host"), cnt = document.getElementById("count"), qi = document.getElementById("q");
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shortT(t) { return String(t || "").replace(/\s+/g, " ").replace(/[（(]\s*p[\d\-–,]+\s*[)）]/gi, "").trim(); }
  var order = Object.keys(byCh).sort();
  function chip(label, val) { var b = document.createElement("button"); b.className = "fc-chip" + (val === cur ? " on" : ""); b.textContent = label; b.dataset.v = val; b.onclick = function () { cur = val; sync(); render(); }; chips.appendChild(b); }
  chip("全部（" + ALL.length + "）", "all");
  order.forEach(function (c) { chip((byCh[c][0].chTitle || c).slice(0, 14) + "（" + byCh[c].length + "）", c); });
  function sync() { Array.prototype.forEach.call(chips.children, function (b) { b.classList.toggle("on", b.dataset.v === cur); }); }
  qi.oninput = function () { kw = qi.value.trim().toLowerCase(); render(); };
  function render() {
    var list = ALL.filter(function (a) {
      if (cur !== "all" && a.ch !== cur) return false;
      if (kw && (String(a.title) + a.chTitle + a.anim).toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
    cnt.textContent = "共 " + list.length + " 个动画";
    var h = "";
    order.forEach(function (c) {
      var arr = list.filter(function (a) { return a.ch === c; });
      if (!arr.length) return;
      h += '<div class="statsbox"><h3 style="margin:0 0 4px"><a href="' + c + '.html" style="text-decoration:none">' + esc(arr[0].chTitle) + '</a> <span class="hint">（' + arr.length + '）</span></h3><div class="anim-grid">';
      arr.forEach(function (a) {
        h += '<div class="anim-card"><div class="ac-h">' + esc(shortT(a.title)) + '</div>' +
          '<div class="ac-m">p' + esc(a.page) + ' · ' + esc(shortT(a.mod).slice(0, 22)) + '</div>' +
          '<div class="ac-b"><a href="' + a.ch + '.html#s_' + esc(a.kp) + '">📄 页内观看</a>' +
          '<a href="anim/' + esc(a.anim) + '.html" target="_blank" rel="noopener">↗ 单独打开</a></div></div>';
      });
      h += '</div></div>';
    });
    host.innerHTML = h || '<p class="empty">没有匹配的动画。</p>';
  }
  render();
})();
</script>
</body>
</html>
