<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fff">
<script>
var q=new URLSearchParams(location.search), a=q.get("a")||"mt_assembly", p=q.get("p")||"0";
var f=document.createElement("iframe");
f.src="anim/"+a+".html?p="+p+"&embed=1"; f.style.cssText="width:960px;height:380px;border:0;display:block";
document.body.appendChild(f);
setTimeout(function(){
  try{
    var cv=f.contentDocument.querySelector("canvas");
    var img=new Image(); img.src=cv.toDataURL("image/png"); img.style.cssText="width:960px;display:block";
    var cap=document.createElement("div"); cap.textContent=a+"  p="+p; cap.style.cssText="font:14px monospace;color:#333";
    document.body.innerHTML=""; document.body.appendChild(img); document.body.appendChild(cap);
    document.title="OK";
  }catch(e){ document.title="ERR="+e.message; }
},1400);
</script></body>
