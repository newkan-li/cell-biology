<style>
.qtop{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.qbar{flex:1;min-width:180px;height:12px;background:#eef2f8;border-radius:8px;overflow:hidden}
.qbar>i{display:block;height:100%;background:linear-gradient(90deg,#4a90d9,#1f5c8b);transition:width .3s}
.qstat{font-size:13px;color:#5b6b7b}
.qnext{background:#eaf4ff;border:1px solid #bcd8f2;color:#1c3f63;border-radius:10px;padding:8px 12px;font-size:13.5px;margin:8px 0}

.qlist{position:relative;margin:10px 0 0;padding-left:0;list-style:none}
.qlevel{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.qlevel.cur{border-left:4px solid #1f5c8b}
.qlevel.done{border-left:4px solid #2f9e5b}
.qmiss{font-size:12px;color:#9a6b00;margin:5px 0 2px;line-height:1.7}
.qmiss.ok{color:#1a7f37}
html[data-theme="dark"] .qmiss{color:#e0c060}

.qnode{flex:0 0 44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:#9bb0c4}
.qlevel.done .qnode{background:#2f9e5b}
.qlevel.cur .qnode{background:#1f5c8b;box-shadow:0 0 0 4px rgba(31,92,139,.15)}
.qbody{flex:1;min-width:0}
.qtitle{font-size:15px;font-weight:600;color:#1f5c8b;margin:0}
.qsub{font-size:12px;color:#5b6b7b;margin:2px 0 6px}
.qtasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:6px}
.qt{font-size:12.6px;color:#33465c;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
.qt-l{display:flex;align-items:center;gap:6px;min-width:0}
.qt-l b{color:#1f5c8b;white-space:nowrap;font-weight:600}
.qt-l .qd{color:#5b6b7b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt-r{flex:0 0 auto;display:flex;gap:4px;flex-wrap:nowrap}
.qt .ic{width:16px;text-align:center}
.qt.done{color:#1a7f37;background:#f6fbf7;border-color:#cdeccf}
.qt a{color:#234f7a;background:#eef4fb;border:1px solid #ccd8ea;border-radius:14px;padding:1px 8px;text-decoration:none;font-size:12px;white-space:nowrap}
html[data-theme="dark"] .qt{background:#1b2531;border-color:#2c3a4a;color:#c9d6e2}
html[data-theme="dark"] .qt.done{background:#1a2b20;border-color:#2f5a3b}
html[data-theme="dark"] .qt a{background:#22303d;border-color:#33475a;color:#a8c6e0}
.qprog{height:6px;background:#eef2f8;border-radius:6px;overflow:hidden;margin-top:4px}
.qprog>i{display:block;height:100%;background:#4a90d9}
.stars{color:#e0a800;letter-spacing:1px;font-size:13px}
.step{display:inline-flex;width:18px;height:18px;border-radius:50%;background:#eef4fb;color:#234f7a;font-size:11px;align-items:center;justify-content:center;font-weight:700;flex:0 0 18px}
.qorder{font-size:11.5px;color:#7a8aa0;margin:4px 0 2px}

.qextra>summary{cursor:pointer;font-size:12.5px;color:#234f7a;font-weight:600}
.qgroup{margin:6px 0}
.qgroup>b{display:block;font-size:12px;color:#5b6b7b;margin-bottom:3px}
html[data-theme="dark"] .qextra{background:#1b2531;border-color:#2c3a4a}

.exq-e{color:#5b6b7b;margin-top:3px}

html[data-theme="dark"] .exq-opt,html[data-theme="dark"] .exq-btn,html[data-theme="dark"] .exq-fill input{background:#22303d;border-color:#33475a;color:#c9d6e2}
html[data-theme="dark"] .exq-ans{background:#22303d;border-color:#33475a;color:#c9d6e2}
html[data-theme="dark"] .step{background:#22303d;color:#9fc3e6}
.subs{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}

html[data-theme="dark"] .sub{background:#22303d;border-color:#33475a;color:#9fb2c7}
html[data-theme="dark"] .sub.ok{background:#1e3325;border-color:#2f5a3b;color:#7fc98f}
.achv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.badge{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;background:#fff}
.badge.locked{opacity:.42;filter:grayscale(1)}
.badge b{display:block;color:#1f5c8b}
.badge .bd{color:#5b6b7b;font-size:11.5px}
html[data-theme="dark"] .badge{background:#1b2531;border-color:#2c3a4a}
html[data-theme="dark"] .badge b{color:#7fb3d8}
html[data-theme="dark"] .qlevel{background:#1b2531;border-color:#2c3a4a}
html[data-theme="dark"] .qtitle{color:#7fb3d8}
html[data-theme="dark"] .qt{color:#c9d6e2}
html[data-theme="dark"] .qnext{background:#22303d;border-color:#33475a;color:#c9d6e2}
</style>

<script>
(function () {
  var PREFIX = "cellbio_";
  function jget(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function jset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
  var QPOOL = [];
  function addWrongQ(cid, e) { var a = jget(skey(cid, "wrong"), []).filter(function (x) { return x.id !== e.id; }); a.push(e); jset(skey(cid, "wrong"), a); }
  function clearWrongQ(cid, id) { jset(skey(cid, "wrong"), jget(skey(cid, "wrong"), []).filter(function (x) { return x.id !== id; })); }
  function recordKp(kp, ok) { if (!kp) return; var o = jget(PREFIX + "kpStats", {}); var c = o[kp] || { ok: 0, n: 0 }; if (c.first === undefined) c.first = !!ok; c.lastOk = !!ok; c.n = (c.n || 0) + 1; if (ok) c.ok = (c.ok || 0) + 1; o[kp] = c; jset(PREFIX + "kpStats", o); }
  function recordQ(cid, item, chosen, ok, correctText) {
    var kind = item.k;
    if (kind === "mcq" || kind === "judge" || kind === "fill") {
      var store = jget(skey(cid, kind), {}), r = store[item.id] || { ok: 0, miss: 0 };
      if (r.first === undefined) r.first = ok; r.n = (r.n || 0) + 1; r.last = chosen;
      if (ok) { r.ok = (r.ok || 0) + 1; r.miss = Math.max(0, (r.miss || 0) - 1); } else { r.miss = (r.miss || 0) + 1; r.ok = Math.max(0, (r.ok || 0) - 1); }
      store[item.id] = r; jset(skey(cid, kind), store);
    } else {
      var st = jget(skey(cid, "self"), {}), r2 = st[item.id] || { ok: 0, miss: 0 };
      if (ok) { r2.ok = (r2.ok || 0) + 1; r2.miss = Math.max(0, (r2.miss || 0) - 1); r2.state = "ok"; }
      else { r2.miss = (r2.miss || 0) + 1; r2.ok = Math.max(0, (r2.ok || 0) - 1); r2.state = (chosen === "part" ? "part" : "no"); }
      st[item.id] = r2; jset(skey(cid, "self"), st);
    }
    if (ok) clearWrongQ(cid, item.id);
    else if (!(kind !== "mcq" && kind !== "judge" && kind !== "fill" && chosen === "part")) addWrongQ(cid, { id: item.id, type: kind, q: item.q, correct: correctText, chosen: String(chosen), cause: "", ts: Date.now() });
    recordKp(item.kp, ok);
  }
  function skey(cid, kind) { return PREFIX + kind + ":" + cid; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  var MANIFEST = window.MANIFEST || [];
  var OUTLINE = window.OUTLINE || [];
  var LESSONS = (window.SCHEDULE && window.SCHEDULE.lessons) || [];
  var EXPMAP = window.EXPMAP || {};
  var CHAPMETA = window.CHAPMETA || {};
  var ANIMSEEN = jget(PREFIX + "animSeen", {});
  var READMARKS = jget(PREFIX + "readMarks", {});
  var ZT = window.ZHENTI || {}, ZO = window.ZTOBJ || {};
  var HIST = window.HISTORY || [], METH = window.METHODS || [], HOTEXP = window.HOTEXP || [];
  var KPQA = window.KPQA || {};
  var KINDNAME = { mcq: "选择", judge: "判断", fill: "填空", short: "简答", calc: "论述", term: "名解" };
  function ztCount(cid) {
    var a = (ZT[cid] && (ZT[cid].length || (ZT[cid].items || []).length)) || 0;
    var b = (ZO[cid] && (ZO[cid].length || (ZO[cid].items || []).length)) || 0;
    return a + b;
  }
  var KP = jget(PREFIX + "kpStats", {});
  var SRS = jget(PREFIX + "srs", {});
  var PASSED = jget(PREFIX + "passed", {});
  var FC = jget(PREFIX + "fcans", {});
  var RECITE = jget(PREFIX + "recite", {});
  var KP_KEY = PREFIX + "kpStats";
  var STK = jget(PREFIX + "streak", { days: {} });
  var TASKS = jget(PREFIX + "tasks", {});
  var RLOG = jget(PREFIX + "reciteLog", {});
  var PLAN = jget(PREFIX + "plan", { exam: "2027-12-20" });
  var DAILY = jget(PREFIX + "daily", { read: 8, practice: 20, review: 5, cards: 10, recite: 5 });
  var PACE = jget(PREFIX + "pace", { perLevel: 5, rounds: 2 });
  var WEEKBOSS = jget(PREFIX + "weekBoss", {});
  var WB_TARGET = jget(PREFIX + "weekBossTarget", 70);
  function isoWeek(d) {
    d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = d.getUTCDay() || 7; d.setUTCDate(d.getUTCDate() + 4 - day);
    var y = d.getUTCFullYear(), start = new Date(Date.UTC(y, 0, 1));
    return y + "-W" + Math.ceil(((d - start) / 86400000 + 1) / 7);
  }
  function todayStr(d) { d = d || new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function streakCount() { var n = 0, d = new Date(); for (var i = 0; i < 3650; i++) { if (STK.days && STK.days[todayStr(d)]) { n++; d.setDate(d.getDate() - 1); } else break; } return n; }
  function starStr(k, n) { return '<span class="stars">' + new Array(k + 1).join("★") + new Array(n - k + 1).join("☆") + "</span>"; }
  function cardsToday() {
    var t = todayStr(), n = 0;
    Object.keys(FC).forEach(function (k) { var o = FC[k]; (o.attempts || []).forEach(function (a) { if (a && a.ts && todayStr(new Date(a.ts)) === t) n++; }); });
    return n;
  }
  function chalStreak() { var CH = jget(PREFIX + "chalDays", {}), n = 0, d = new Date(); if (!CH[todayStr(d)]) d.setDate(d.getDate() - 1); for (var i = 0; i < 3650; i++) { if (CH[todayStr(d)]) { n++; d.setDate(d.getDate() - 1); } else break; } return n; }
  function bar(p) { return '<div class="qprog" style="display:inline-block;width:120px;vertical-align:middle"><i style="width:' + Math.min(100, Math.round(p * 100)) + '%"></i></div>'; }
  function renderDaily() {
    var t = todayStr(), td = TASKS[t] || { read: 0, review: 0, practice: 0 };
    var items = [
      { k: "read", ic: "📖", t: "学习（已读页）", v: td.read || 0, g: DAILY.read },
      { k: "practice", ic: "✍️", t: "练习（题）", v: td.practice || 0, g: DAILY.practice },
      { k: "review", ic: "🔁", t: "复习", v: td.review || 0, g: DAILY.review },
      { k: "cards", ic: "🃏", t: "闪卡", v: cardsToday(), g: DAILY.cards },
      { k: "recite", ic: "🧠", t: "背诵掌握", v: RLOG[t] || 0, g: DAILY.recite }
    ];
    var all = items.every(function (x) { return x.v >= x.g; });
    var CH = jget(PREFIX + "chalDays", {});
    if (all) { if (!CH[t]) { CH[t] = 1; jset(PREFIX + "chalDays", CH); } }
    document.getElementById("qdaily").innerHTML = '<div class="qtasks">' + items.map(function (x) {
      var ok = x.v >= x.g;
      return '<div class="qt ' + (ok ? "done" : "") + '"><span class="ic">' + (ok ? "✅" : "⬜") + "</span>" + x.ic + " " + x.t +
        " <b>" + Math.min(x.v, x.g) + "/" + x.g + "</b> " + bar(x.g ? x.v / x.g : 0) + '</div>';
    }).join("") + "</div>" +
      '<div class="hint" style="margin-top:6px">目标可改：' +
      ["read", "practice", "review", "cards", "recite"].map(function (k) {
        return ["学", "练", "复", "卡", "背"][["read", "practice", "review", "cards", "recite"].indexOf(k)] + '<input type="number" min="0" data-dg="' + k + '" value="' + DAILY[k] + '" style="width:52px;margin:0 6px 0 2px">';
      }).join("") + '</div>';
    Array.prototype.forEach.call(document.querySelectorAll("#qdaily [data-dg]"), function (inp) {
      inp.onchange = function () { DAILY[inp.dataset.dg] = Math.max(0, parseInt(inp.value, 10) || 0); jset(PREFIX + "daily", DAILY); renderDaily(); };
    });
    document.getElementById("qchstreak").textContent = "连续完成挑战 " + chalStreak() + " 天" + (all ? " · 今日已达成 🎉" : "");
  }
  function renderPace(doneCount, lDone, lTot) {
    var exam = PLAN.exam || "2027-12-20";
    var days = Math.max(0, Math.ceil((new Date(exam + "T00:00:00") - new Date()) / 86400000));
    var left = stats.length - doneCount;
    var perLevel = PACE.perLevel || 5, rounds = PACE.rounds || 2;
    var baseDays = stats.length * perLevel;                 // 第一轮：逐章学习+首通
    var reviewDays = Math.round(baseDays * 0.6 * rounds);   // 之后每轮复习约占一轮的 60%
    var need = baseDays + reviewDays;
    var perWeek = (7 / perLevel).toFixed(1);
    var lLeft = lTot - lDone;
    document.getElementById("qpace").innerHTML =
      '<div class="qtasks">' +
      '<div class="qt">🗓 距考试 <b>' + days + '</b> 天（' + esc(exam) + '）</div>' +

        return '<div class="qt ' + (t.done ? "done" : "") + '"><div class="qt-l"><span class="step">' + (k + 1) + '</span><span class="ic">' + (t.done ? "✅" : "⬜") + '</span><b>' + icon[k] + '</b><span class="qd">' + esc(t.txt) + '</span></div><div class="qt-r">' + link + '</div></div>';
      }).join("");
      var undone = s.tasks.map(function (t, k) { return t.done ? null : (icon[k] + "（" + t.txt + "）"); }).filter(Boolean);
      var missLine = undone.length ? '<div class="qmiss">⏳ 还差 ' + undone.length + " 项：" + undone.map(esc).join("、") + "</div>" : '<div class="qmiss ok">✅ 本关已完成</div>';
      var cls = s.done ? "done" : "cur";
      host += '<div class="qlevel ' + cls + '"><div class="qnode">' + (s.done ? "✓" : (i + 1)) + '</div>' +
        '<div class="qbody"><div class="qtitle">第 ' + (i + 1) + ' 关 · ' + esc(String(s.title).slice(0, 22)) + " " + starStr(s.doneN, s.n) + (s.done ? ' <span style="color:#2f9e5b">已通关</span>' : "") + '</div>' +
        '<div class="qsub">' + esc(sub) + ' · 任务 ' + s.doneN + "/" + s.n + ' · 掌握 ' + masteryDone + "/" + masteryTot + '</div>' +
        '<div class="qorder">按 1→7 顺序完成：①学习 ②练习 ③背诵 ④闪卡/复习 ⑤通关测 ⑥实验 ⑦动画 —— 全部完成后通关并解锁下一关</div>' +
        '<div class="qprog"><i style="width:' + Math.round(s.doneN / s.n * 100) + '%"></i></div>' +
        missLine +
        '<div class="qtasks" style="margin-top:6px">' + rows + '</div>' + extraBox + '</div></div>';
      prevDone = s.done;
    });
    document.getElementById("qhost").innerHTML = host;
    Array.prototype.forEach.call(document.querySelectorAll("#qhost [data-mk]"), function (a) {
      a.onclick = function (ev) {
        ev.preventDefault();
        var k = a.dataset.mk;
        if (READMARKS[k]) delete READMARKS[k]; else READMARKS[k] = 1;
        jset(PREFIX + "readMarks", READMARKS); render();
      };
    });
    var pct = Math.round(doneCount / stats.length * 100);
    var mTot = 0, mDone = 0;
    stats.forEach(function (s) { mTot += (s.masteryTot || 0); mDone += (s.masteryDone || 0); });
    var totalStars = 0, maxStars = 0, lTot = 0, lDone = 0;
    stats.forEach(function (s) { totalStars += s.doneN; maxStars += s.n; (s.lessons || []).forEach(function (L) { lTot++; if (L.ratio >= 0.8) lDone++; }); });
    document.getElementById("qfill").style.width = pct + "%";
    document.getElementById("qstat").textContent = "已通关 " + doneCount + "/" + stats.length + "（" + pct + "%） · ⭐ " + totalStars + "/" + maxStars + (lTot ? " · 小关卡 " + lDone + "/" + lTot : "") + (mTot ? " · 掌握 " + mDone + "/" + mTot : "");
    if (nextRec) {
      var di = -1; nextRec.tasks.forEach(function (x, i) { if (di < 0 && !x.done) di = i; });
      var dlabel = di >= 0 ? ("<b>第 " + (di + 1) + " 步 " + icon[di] + "</b>（" + esc(nextRec.tasks[di].txt) + "）") : "";
      document.getElementById("qnext").innerHTML = "👉 <b>下一步</b>：第 " + (stats.indexOf(nextRec) + 1) + " 关「" + esc(String(nextRec.title).slice(0, 16)) + "」—— 建议先完成 " + dlabel + "。" +
        ' 进入：<a href="' + nextRec.cid + '.html">' + esc(nextRec.cid) + '</a> ｜ <a href="recite.html?ch=' + nextRec.cid + '">背诵</a>';
    } else {
      document.getElementById("qnext").innerHTML = "🎉 全部通关！可去 <a href='exam.html'>📝 模拟测验</a> / <a href='802.html'>📋 802 真题</a> 冲刺。";
    }

    /* 成就 */
    var passedN = 0, bestMax = 0;
    Object.keys(PASSED).forEach(function (cid) { var p = PASSED[cid]; if (p && p.passed) passedN++; if (p && (p.best || 0) > bestMax) bestMax = p.best || 0; });
    var masteredRecite = 0; OUTLINE.forEach(function (x) { if (RECITE[x.id] === "ok") masteredRecite++; });
    var fcN = Object.keys(FC).length, streak = streakCount();
    var _wb = WEEKBOSS[isoWeek(new Date())], weeklyDone = !!(_wb && _wb.best >= WB_TARGET);
    var ACH = [
      { icon: "🚩", t: "出发", d: "通关第 1 关", ok: doneCount >= 1 },
      { icon: "📗", t: "学而时习", d: "通关 5 关", ok: doneCount >= 5 },
      { icon: "📘", t: "半壁江山", d: "通关 10 关", ok: doneCount >= 10 },
      { icon: "👑", t: "全通关", d: "通关全部 20 关", ok: doneCount >= stats.length },
      { icon: "🏁", t: "首战告捷", d: "任一通关测通过", ok: passedN >= 1 },
      { icon: "🏅", t: "高分选手", d: "通关测最好 ≥90%", ok: bestMax >= 90 },
      { icon: "🔥", t: "坚持", d: "连续打卡 ≥7 天", ok: streak >= 7 },
      { icon: "🧠", t: "背诵达人", d: "必背“掌握” ≥50 条", ok: masteredRecite >= 50 },
      { icon: "🃏", t: "闪卡达人", d: "闪卡作答 ≥100 次", ok: fcN >= 100 },
      { icon: "⭐", t: "满星关", d: "任一章满任务（7/7）", ok: (function () { return stats.some(function (s) { return s.doneN === s.n; }); })() },
      { icon: "🎬", t: "动画达人", d: "观看动画 ≥50 个", ok: (function () { return Object.keys(ANIMSEEN).length >= 50; })() },
      { icon: "❌", t: "清道夫", d: "错题清零的章 ≥10", ok: (function () { return stats.filter(function (s) { return s.extra && !s.extra.wrong; }).length >= 10; })() },
      { icon: "🎓", t: "全书通关", d: "20 章全通 + 模拟 ≥70%", ok: (doneCount >= stats.length && ((function () { return jget(PREFIX + "examBest", {}).best || 0; })()) >= 70) },
      { icon: "🗡️", t: "周 Boss", d: "本周限时模拟 ≥ 目标", ok: weeklyDone },
      { icon: "📚", t: "掌握达人", d: "掌握清单累计 ≥100 项", ok: mDone >= 100 },
      { icon: "🏵", t: "全掌握章", d: "某章掌握 100%", ok: stats.some(function (s) { return s.masteryTot && s.masteryDone === s.masteryTot; }) }
    ];
    var got = ACH.filter(function (a) { return a.ok; }).length;
    document.getElementById("qachv").innerHTML = ACH.map(function (a) {
      return '<div class="badge ' + (a.ok ? "" : "locked") + '"><b>' + a.icon + " " + a.t + '</b><span class="bd">' + a.d + '</span></div>';
    }).join("") + '<div class="badge" style="grid-column:1/-1"><b>已获得成就 ' + got + "/" + ACH.length + "</b><span class=\"bd\">继续闯关解锁更多成就</span></div>";

    /* 期末 Boss（全书综合） */
    var examBest = jget(PREFIX + "examBest", {});
    var allDone = doneCount === stats.length;
    var examOk = (examBest.best || 0) >= 70;
    var bossDone = allDone && examOk;
    document.getElementById("qboss").innerHTML =
      '<div class="qlevel ' + (bossDone ? "done" : "cur") + '"><div class="qnode">👑</div><div class="qbody">' +
      '<div class="qtitle">期末 Boss · 全书综合' + (bossDone ? ' <span style="color:#2f9e5b">已通关</span>' : "") + '</div>' +
      '<div class="qsub">通关条件：20 章全部通关 ＋ 模拟测验最好成绩 ≥70%</div>' +
      '<div class="qtasks">' +
        '<div class="qt ' + (allDone ? "done" : "") + '"><span class="ic">' + (allDone ? "✅" : "⬜") + '</span>👑 全部章节通关：' + doneCount + "/" + stats.length + '</div>' +
        '<div class="qt ' + (examOk ? "done" : "") + '"><span class="ic">' + (examOk ? "✅" : "⬜") + '</span>📝 模拟测验最好：' + (examBest.best != null ? examBest.best + "%" : "未测") + '（目标 ≥70%）<a href="exam.html">去测验</a><a href="802.html">802 整套</a></div>' +
        '<div class="qt"><span class="ic">📚</span>复习资料：<a href="mindmap.html">跨章总图</a><a href="compare.html">对比速记</a><a href="textbook.html">教材对照</a><a href="wrong.html">错题本</a></div>' +
      '</div></div></div>';

    renderDaily();
    renderPace(doneCount, lDone, lTot);
    renderWeekly();
  }
  document.getElementById("qhost").addEventListener("click", onQClick);
  render();
})();
</script>
</body>
</html>
