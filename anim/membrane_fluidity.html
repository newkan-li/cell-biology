<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>膜脂的运动性</title><link rel="stylesheet" href="anim.css?v=20260926bp"></head><body>
<script src="anim.js?v=20260926bp"></script>
<script>
(function(){
  function drawLipid(ctx,x,y,flip,tail,rot){
    var dir=flip?-1:1;
    ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
    ctx.fillStyle='#e8402a';ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();
    ctx.strokeStyle='#f0a08a';ctx.lineWidth=3;
    for(var s=-1;s<=1;s+=2){
      ctx.beginPath();ctx.moveTo(s*3,dir*6);
      ctx.quadraticCurveTo(s*(3+tail*4),dir*16,s*(3+tail*6),dir*26);ctx.stroke();
    }
    ctx.restore();
  }
  var NAMES=['① 侧向运动 (lateral diffusion)','② 翻转运动 (flip-flop, 罕见)','③ 尾部摆动 (flexion)','④ 绕轴心自旋 (rotation)'];
  AnimKit.mount({
    title:'膜脂的运动性（膜脂的四种运动方式）',
    sub:'①同一侧侧向运动（基本方式）②双层间翻转（罕见）③尾部摆动 ④绕轴心自旋。',
    legend:[{c:'#e8402a',t:'磷脂分子'}],
    init:function(S){S.mode=0;S.p=0;},
    phases:[
      {name:NAMES[0],dur:1500,note:'同一侧的侧向运动（lateral diffusion）是膜脂最基本的运动方式。',ap:function(S){S.mode=0;}},
      {name:NAMES[1],dur:1500,note:'双层分子之间的翻转运动（flip-flop）很少发生，需酶协助。',ap:function(S){S.mode=1;}},
      {name:NAMES[2],dur:1400,note:'脂肪酸尾部摆动（flexion）。',ap:function(S){S.mode=2;}},
      {name:NAMES[3],dur:1400,note:'磷脂分子绕轴心自旋（rotation）。',ap:function(S){S.mode=3;}}
    ],
    update:function(S,e){S.p+=0.02*e*2;if(S.p>1)S.p=0;},
    draw:function(ctx,W,H,S){
      var yTop=H*.40,yBot=H*.60,cy=(yTop+yBot)/2;
      ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ffe9c9';ctx.fillRect(0,yTop,W,yBot-yTop);
      var step=46,idx=0,hi=6;
      for(var x=30;x<W-20;x+=step){
        var tail=0,flip=false,rot=0;
        if(idx===hi){
          if(S.mode===0)x+=Math.sin(S.p*Math.PI*2)*24;
          if(S.mode===2)tail=Math.abs(Math.sin(S.p*Math.PI*2));
        }
        drawLipid(ctx,x,yTop,false,idx===hi&&S.mode===2?tail:0,0);
        drawLipid(ctx,x,yBot,true,0,0);
        idx++;
      }
      var hx=W-72;
      if(S.mode===1){
        var yy=AnimKit.lerp(yTop,yBot,Math.abs(Math.sin(S.p*Math.PI)));
        drawLipid(ctx,hx,yy,false,0,0);
        ctx.strokeStyle='#c0392b';ctx.setLineDash([5,4]);ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(hx-40,yTop-6);ctx.quadraticCurveTo(hx-70,cy,hx-40,yBot+6);ctx.stroke();ctx.setLineDash([]);
        AnimKit.label(ctx,'flip-flop rarely occurs',hx-46,cy,'#c0392b','11px Arial','right');
      } else if(S.mode===3){
        drawLipid(ctx,hx,yTop,false,0,S.p*Math.PI*2);
      } else {
        drawLipid(ctx,hx,yTop,false,0,0);
      }
      AnimKit.label(ctx,'细胞外',14,22,'#7a8aa0','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'细胞内',14,H-14,'#7a8aa0','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,NAMES[S.mode],W/2,30,'#1f5c8b','bold 15px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
