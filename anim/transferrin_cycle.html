<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>转铁蛋白循环</title><link rel="stylesheet" href="anim.css?v=20260926ag"></head><body>
<script src="anim.js?v=20260926ag"></script>
<script>
(function(){
  AnimKit.mount({
    title:'转铁蛋白循环',
    sub:'转铁蛋白结合 Fe³⁺ 经受体介导内吞，内体酸性环境释放铁，受体与转铁蛋白返回质膜循环使用。',
    legend:[{c:'#e8703a',t:'Fe³⁺'},{c:'#3b6fd6',t:'转铁蛋白'},{c:'#2e9e5b',t:'转铁蛋白受体'}],
    init:function(S){},
    phases:[
      {name:'① 转铁蛋白结合 Fe³⁺',dur:1300,note:'血浆中的转铁蛋白(transferrin)结合 Fe³⁺。',ap:function(){}},
      {name:'② 与质膜受体结合',dur:1300,note:'转铁蛋白与质膜上的转铁蛋白受体结合。',ap:function(){}},
      {name:'③ 内吞、内体释放铁',dur:1400,note:'受体-转铁蛋白复合物经内吞进入细胞；内体呈酸性，使转铁蛋白释放 Fe³⁺。',ap:function(){}},
      {name:'④ 受体-转铁蛋白回收',dur:1400,note:'释放铁后，转铁蛋白与受体返回质膜，循环使用。',ap:function(){}},
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f7fbff';ctx.fillRect(0,0,W,H);
      var cx=W*0.5,yMem=H*0.30;
      ctx.fillStyle='#f2f8ff';ctx.fillRect(0,0,W,yMem-8);
      ctx.fillStyle='#fbfefc';ctx.fillRect(0,yMem+8,W,H-yMem-8);
      ctx.fillStyle='#ffe9c9';ctx.fillRect(0,yMem-8,W,16);
      AnimKit.label(ctx,'细胞外',14,20,'#7a8aa0','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'细胞质',14,H-12,'#7a8aa0','12px "Microsoft YaHei"','left');
      // receptor on membrane
      AnimKit.roundRect(ctx,cx-16,yMem-16,32,32,8);ctx.fillStyle='#2e9e5b';ctx.fill();
      AnimKit.label(ctx,'转铁蛋白受体',cx,yMem+40,'#3d7a5a','11.5px "Microsoft YaHei"');
      // transferrin+Fe outside
      var ty=yMem-40;
      AnimKit.circle(ctx,cx,ty,14,'#3b6fd6','Tf');
      if(phaseI===0)AnimKit.circle(ctx,cx+16,ty-10,6,'#e8703a','Fe');
      if(phaseI>=1&&phaseI<=1)AnimKit.circle(ctx,cx+16,ty-10,6,'#e8703a','Fe');
      // endosome inside
      var ey=H*0.62;
      if(phaseI>=2){AnimKit.circle(ctx,cx,ey,34,'#e8f0fb',null);ctx.strokeStyle='#b9d2e6';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,ey,34,0,7);ctx.stroke();AnimKit.label(ctx,'内体 pH 酸性',cx+50,ey,'#33465c','11.5px "Microsoft YaHei"','left');}
      if(phaseI===2){AnimKit.circle(ctx,cx,ey,14,'#3b6fd6','Tf');for(var f=0;f<3;f++)AnimKit.circle(ctx,cx-16+f*16,ey+22,5,'#e8703a','');AnimKit.arrow(ctx,cx,ey+16,cx,ey+30,'#e8703a',2);}
      if(phaseI>=1&&phaseI<2){AnimKit.arrow(ctx,cx,ty+16,cx,yMem-18,'#33465c',2);}
      if(phaseI===2){AnimKit.arrow(ctx,cx,yMem+18,cx,ey-34,'#33465c',2);}
      if(phaseI>=3){AnimKit.arrow(ctx,cx,ey-34,cx,yMem+18,'#2e9e5b',2.5);AnimKit.circle(ctx,cx,yMem-40,14,'#3b6fd6','Tf');AnimKit.label(ctx,'受体与转铁蛋白回收、循环使用',cx+70,yMem-40,'#2e7d32','12px "Microsoft YaHei"','left');}
      AnimKit.label(ctx,'转铁蛋白循环：Fe³⁺ 的摄取',W/2,22,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
