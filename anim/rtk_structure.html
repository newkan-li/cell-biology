<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RTK结构激活</title><link rel="stylesheet" href="anim.css?v=20260926av"></head><body>
<script src="anim.js?v=20260926av"></script>
<script>
(function(){
  AnimKit.mount({
    title:'受体酪氨酸激酶(RTK)的结构与激活',
    sub:'RTK 单次跨膜，具胞外配体结合域、跨膜区和胞内酪氨酸激酶域；配体使两个单体二聚化、互相磷酸化(自身磷酸化)而激活。',
    legend:[{c:'#c0392b',t:'RTK'},{c:'#2e9e5b',t:'磷酸化'}],
    phases:[
      {name:'① 单体(无活性)',dur:1400,note:'无配体时 RTK 以无活性单体存在。'},
      {name:'② 配体结合→二聚化',dur:1500,note:'配体使两个单体在膜上聚合成二聚体。'},
      {name:'③ 自身磷酸化',dur:1600,note:'二聚化受体胞内酪氨酸互相磷酸化而激活。'},
      {name:'④ 招募下游蛋白',dur:1500,note:'磷酸酪氨酸成为含 SH2 蛋白的停泊位点。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'RTK 的结构与激活',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var m=AnimKit.membrane(ctx,W,H,{yTop:H*0.40,yBot:H*0.56,cx:W/2,gap:90});
      var sp=phaseI>=1?26:8;
      [W/2-sp,W/2+sp].forEach(function(x){ ctx.strokeStyle='#c0392b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,m.yTop-40);ctx.lineTo(x,m.yBot+40);ctx.stroke();
        if(phaseI>=2) AnimKit.circle(ctx,x,m.yBot+22,8,'#2e9e5b','P'); });
      if(phaseI>=1) AnimKit.circle(ctx,W/2,m.yTop-56,9,'#8e5bb5','L');
      AnimKit.label(ctx,'胞外结合域',W/2-sp-70,m.yTop-10,'#45687f','12px "Microsoft YaHei"');
      AnimKit.label(ctx,'胞内酪氨酸激酶域',W/2,m.yBot+70,'#c0392b','12px "Microsoft YaHei"');
      if(phaseI>=3) AnimKit.label(ctx,'磷酸酪氨酸 → 招募含 SH2 蛋白',W/2,m.yBot+100,'#1e7a45','12px "Microsoft YaHei"');
      AnimKit.label(ctx,['①无活性单体','②配体→二聚化','③自身磷酸化','④招募下游'][phaseI],W/2,H-16,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
