<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主动运输的三种动力</title><link rel="stylesheet" href="anim.css?v=20260926aw"></head><body>
<script src="anim.js?v=20260926aw"></script>
<script>
(function(){
  AnimKit.mount({
    title:'主动运输的三种动力',
    sub:'①ATP 驱动(泵)；②离子梯度驱动(协同运输)；③光能驱动(细菌视紫红质)。都逆浓度梯度、耗能。',
    legend:[{c:'#e8703a',t:'ATP'},{c:'#3b6fd6',t:'离子梯度'},{c:'#e8a13a',t:'光能'}],
    init:function(S){},
    phases:[
      {name:'① ATP 驱动（泵）',dur:1300,note:'直接水解 ATP 供能，如 Na⁺/K⁺-ATPase、Ca²⁺ 泵。',ap:function(){}},
      {name:'② 离子梯度驱动（协同运输）',dur:1400,note:'利用一种离子顺浓度梯度的势能，驱动另一种物质逆浓度梯度运输。',ap:function(){}},
      {name:'③ 光能驱动',dur:1300,note:'细菌视紫红质吸收光能，把 H⁺ 泵出细胞，形成质子梯度。',ap:function(){}},
      {name:'④ 共同点',dur:1300,note:'三种方式都逆浓度梯度运输、都需要能量、都属于主动运输。',ap:function(){}},
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f7fbff';ctx.fillRect(0,0,W,H);
      var ym=H*0.52;
      ctx.fillStyle='#ffe9c9';ctx.fillRect(0,ym-12,W,24);
      var xs=[W*0.2,W*0.5,W*0.8];
      ctx.globalAlpha=(phaseI===0||phaseI===3)?1:0.35;
      AnimKit.roundRect(ctx,xs[0]-24,ym-20,48,40,8);ctx.fillStyle='#2e9e5b';ctx.fill();
      AnimKit.label(ctx,'ATP 泵',xs[0],ym+44,'#3d7a5a','12px "Microsoft YaHei"');
      if(phaseI===0||phaseI===3)AnimKit.label(ctx,'ATP→ADP+Pi',xs[0],ym-30,'#e8703a','11.5px "Microsoft YaHei"');
      ctx.globalAlpha=1;
      ctx.globalAlpha=(phaseI===1||phaseI===3)?1:0.35;
      AnimKit.roundRect(ctx,xs[1]-28,ym-20,56,40,8);ctx.fillStyle='#3b6fd6';ctx.fill();
      AnimKit.label(ctx,'协同运输',xs[1],ym+44,'#1f5c8b','12px "Microsoft YaHei"');
      if(phaseI===1||phaseI===3){AnimKit.arrow(ctx,xs[1]-40,ym-28,xs[1]-10,ym-4,'#3b6fd6',2);AnimKit.arrow(ctx,xs[1]-10,ym+4,xs[1]-40,ym+28,'#8e44ad',2);}
      ctx.globalAlpha=1;
      ctx.globalAlpha=(phaseI===2||phaseI===3)?1:0.35;
      AnimKit.roundRect(ctx,xs[2]-24,ym-20,48,40,8);ctx.fillStyle='#7d3c98';ctx.fill();
      AnimKit.label(ctx,'细菌视紫红质',xs[2],ym+44,'#5b2c6f','12px "Microsoft YaHei"');
      if(phaseI===2||phaseI===3){ctx.strokeStyle='#e8a13a';ctx.lineWidth=2;for(var a=0;a<4;a++){var ax=xs[2]-50+a*8;ctx.beginPath();ctx.moveTo(ax,ym-44);ctx.lineTo(ax+6,ym-36);ctx.stroke();}AnimKit.arrow(ctx,xs[2],ym-20,xs[2],ym-42,'#e8703a',2);AnimKit.label(ctx,'光能',xs[2]+30,ym-40,'#a9781f','11.5px "Microsoft YaHei"','left');}
      ctx.globalAlpha=1;
      AnimKit.label(ctx,'主动运输：逆浓度梯度、耗能',W/2,22,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
