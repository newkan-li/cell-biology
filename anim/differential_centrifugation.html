<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>差速离心</title><link rel="stylesheet" href="anim.css?v=20260926bn"></head><body>
<script src="anim.js?v=20260926bn"></script>
<script>
(function(){
  AnimKit.mount({
    title:'差速离心分离细胞组分',
    sub:'组织匀浆后逐级提高离心力：20,000g 沉淀核/线粒体/过氧化物酶体/未破碎细胞；50,000g 沉淀微粒体。',
    legend:[{c:'#8e44ad',t:'核/线粒体/过氧化物酶体/未破碎细胞'},{c:'#2e9e5b',t:'微粒体 microsome'}],
    init:function(S){S.pellets=[];S.spin=0;},
    phases:[
      {name:'① 组织匀浆（Homogenize）',dur:1200,note:'破碎细胞制成匀浆，含各种膜性小泡(membranous vesicles)。',ap:function(S){S.pellets=[];}},
      {name:'② 20,000g，20 min',dur:1400,note:'沉淀为：核、线粒体、过氧化物酶体及未破碎的细胞；上清为核后上清(postnuclear supernatant)。',ap:function(S){S.pellets=[{c:'#8e44ad',t:'核、线粒体、过氧化物酶体、未破碎细胞'}];}},
      {name:'③ 取上清，50,000g，2 hrs',dur:1400,note:'再离心沉淀为微粒体(microsome)——即破碎的内质网膜小泡。',ap:function(S){S.pellets=[{c:'#8e44ad',t:'核、线粒体、过氧化物酶体'},{c:'#2e9e5b',t:'微粒体 microsome'}];}}
    ],
    update:function(S,e){S.spin+=0.25*e;},
    draw:function(ctx,W,H,S){
      ctx.fillStyle='#f7fbff';ctx.fillRect(0,0,W,H);
      var x=W*.42,w=W*.20,yT=H*.14,yB=H*.86;
      AnimKit.roundRect(ctx,x,yT,w,yB-yT,w*.3);ctx.fillStyle='#eaf3fb';ctx.fill();ctx.strokeStyle='#b9d2e6';ctx.lineWidth=3;ctx.stroke();
      ctx.save();AnimKit.roundRect(ctx,x,yT,w,yB-yT,w*.3);ctx.clip();ctx.fillStyle='#f0f7fc';ctx.fillRect(x,yT,w,yB-yT);
      var ph=(yB-yT)*0.16;
      S.pellets.forEach(function(p,i){var yy=yB-8-(i+1)*ph;AnimKit.roundRect(ctx,x+6,yy,w-12,ph-3,6);ctx.fillStyle=p.c;ctx.fill();});
      ctx.restore();
      S.pellets.forEach(function(p,i){var yy=yB-8-(i+1)*ph;AnimKit.label(ctx,p.t,x+w+14,yy+ph/2,'#33465c','12px "Microsoft YaHei"','left');AnimKit.arrow(ctx,x+w+6,yy+ph/2,x+w+12,yy+ph/2,p.c,2);});
      var rx=W*.80,ry=H*.30;
      ctx.save();ctx.translate(rx,ry);ctx.rotate(S.spin);ctx.strokeStyle='#9bb6cc';ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(0,0,34,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(34,0);ctx.moveTo(0,-34);ctx.lineTo(0,34);ctx.stroke();ctx.restore();
      AnimKit.label(ctx,'离心机',rx,ry+58,'#7a8aa0','12px "Microsoft YaHei"');
      if(S.pellets.length===0)AnimKit.label(ctx,'均匀悬液（匀浆）',x+w/2,yT+30,'#7a8aa0','12px "Microsoft YaHei"');
      var sp=['Homogenize','20,000 g / 20 min','50,000 g / 2 hrs'];
      AnimKit.label(ctx,'转速：'+sp[S.pellets.length],W/2,26,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
