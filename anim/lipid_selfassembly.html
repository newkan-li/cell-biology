<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脂双层自装配</title><link rel="stylesheet" href="anim.css?v=20260926ak"></head><body>
<script src="anim.js?v=20260926ak"></script>
<script>
(function(){
  function bigMol(ctx,x,y,s){
    ctx.fillStyle='#c0392b';ctx.beginPath();ctx.arc(x,y,16*s,0,7);ctx.fill();
    ctx.strokeStyle='#e08a5a';ctx.lineWidth=9*s;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x-5*s,y+14*s);ctx.quadraticCurveTo(x-8*s,y+40*s,x-3*s,y+62*s);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+5*s,y+14*s);ctx.quadraticCurveTo(x+10*s,y+40*s,x+14*s,y+62*s);ctx.stroke();
  }
  function bilayer(ctx,x0,x1,yc,gap,n){
    var step=(x1-x0)/n;
    for(var i=0;i<n;i++){var x=x0+step*(i+0.5);
      ctx.fillStyle='#c0392b';ctx.beginPath();ctx.arc(x,yc-gap/2,6,0,7);ctx.fill();
      ctx.beginPath();ctx.arc(x,yc+gap/2,6,0,7);ctx.fill();
      ctx.strokeStyle='#e08a5a';ctx.lineWidth=3;
      for(var s=-1;s<=1;s+=2){ctx.beginPath();ctx.moveTo(x+s*3,yc-gap/2+5);ctx.lineTo(x+s*4,yc-3);ctx.stroke();
        ctx.beginPath();ctx.moveTo(x+s*3,yc+gap/2-5);ctx.lineTo(x+s*4,yc+3);ctx.stroke();}
    }
  }
  AnimKit.mount({
    title:'磷脂分子的自装配（双层性）',
    sub:'两性物质（一个亲水头 + 一/两条疏水尾）在水中自动、自我装配成连续不破裂的脂双层。',
    legend:[{c:'#c0392b',t:'亲水头'},{c:'#e08a5a',t:'疏水尾'},{c:'#7fb3e0',t:'水'}],
    init:function(S){S.stage=0;},
    phases:[
      {name:'① 一个亲水头 + 疏水尾',dur:1200,note:'磷脂是两性分子：具有一个亲水头部和一或两条疏水尾部。',ap:function(S){S.stage=0;}},
      {name:'② 加水',dur:1200,note:'把两性分子放入水中（+水）。',ap:function(S){S.stage=1;}},
      {name:'③ 自装配成脂双层',dur:1500,note:'在水中自动、自我装配成脂双层，总是形成连续、不破裂的结构（the ability to self-assemble）。',ap:function(S){S.stage=2;}},
      {name:'④ 能量最低的排列方式',dur:1400,note:'从能量角度看，两性分子在水溶液中最佳排列方式为磷脂双层。',ap:function(S){S.stage=3;}}
    ],
    update:function(S,e){},
    draw:function(ctx,W,H,S){
      ctx.fillStyle='#fbfdff';ctx.fillRect(0,0,W,H);
      // left: single molecule
      bigMol(ctx,W*0.16,H*0.50,1.15);
      AnimKit.label(ctx,'亲水头',W*0.16+34,H*0.50-24,'#33465c','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'疏水尾',W*0.16+34,H*0.50+44,'#33465c','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'图11-5 典型膜脂质分子',W*0.16,H*0.86,'#7a8aa0','11px "Microsoft YaHei"');
      // arrow +水
      AnimKit.arrow(ctx,W*0.30,H*0.50,W*0.40,H*0.50,'#5b6b7b',3);
      AnimKit.label(ctx,'+ 水',W*0.35,H*0.50-16,'#1f5c8b','bold 15px "Microsoft YaHei"');
      // right: water box + bilayer
      var bx0=W*0.46,bx1=W*0.97,byT=H*0.18,byB=H*0.82,yc=H*0.50;
      if(S.stage>=1){
        ctx.fillStyle='#dcecf9';ctx.fillRect(bx0,byT,bx1-bx0,byB-byT);
        AnimKit.label(ctx,'水',bx0+8,byT+18,'#3a7ca5','12px "Microsoft YaHei"','left');
        AnimKit.label(ctx,'水',bx0+8,byB-8,'#3a7ca5','12px "Microsoft YaHei"','left');
      }
      if(S.stage>=2){bilayer(ctx,bx0,bx1,yc,H*0.14,14);}
      if(S.stage>=3)AnimKit.label(ctx,'磷脂双层（能量最低）',(bx0+bx1)/2,yc,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
