<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCF与APC</title><link rel="stylesheet" href="anim.css?v=20260926bv"></head><body>
<script src="anim.js?v=20260926bv"></script>
<script>
(function(){
  AnimKit.mount({
    title:'两类 E3 泛素连接酶：SCF 与 APC 的分工',
    sub:'SCF 主要负责间期，降解 G1/S-cyclin 和某些 CKI(p21/p27)；APC 是促后期复合物，介导 M 期蛋白泛素化、促进进入后期。',
    legend:[{c:'#5a7fa8',t:'SCF(间期)'},{c:'#2e9e5b',t:'APC(M期)'}],
    phases:[
      {name:'① SCF 降解 G1/S-cyclin',dur:1500,note:'SCF 在间期把泛素连到 G1/S-cyclin。'},
      {name:'② SCF 降解 CKI(p21/p27)',dur:1500,note:'SCF 也降解 CKI，解除对 CDK 的抑制。'},
      {name:'③ APC 被激活',dur:1500,note:'APC(促后期复合物) 在 M 期被激活。'},
      {name:'④ APC 促进进入后期',dur:1600,note:'APC 泛素化 M 期蛋白、降解 securin 与 cyclin，进入后期。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'SCF 与 APC',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var cy=H/2+10;
      AnimKit.pill(ctx,120,cy-24,200,48, phaseI<2?'#5a7fa8':'#e6ecf2','SCF(间期)', phaseI<2?'#fff':'#7a8aa0');
      AnimKit.pill(ctx,W-320,cy-24,200,48, phaseI>=2?'#2e9e5b':'#e6ecf2','APC(促后期)', phaseI>=2?'#fff':'#7a8aa0');
      if(phaseI<2){ AnimKit.label(ctx,['降解 G1/S-cyclin','降解 CKI(p21/p27)'][phaseI],320,cy,'#45687f','12px "Microsoft YaHei"','left'); }
      if(phaseI>=2){ AnimKit.label(ctx,['被激活','降解 securin/cyclin → 进入后期'][phaseI-2],W-340,cy,'#1e7a45','12px "Microsoft YaHei"','right'); }
      AnimKit.label(ctx,'一个守间期(G1/S)，一个管 M 期',W/2,cy+80,'#1f5c8b','bold 13px "Microsoft YaHei"');
      AnimKit.label(ctx,['①SCF降解G1/S-cyclin','②SCF降解CKI','③APC激活','④APC促进入后期'][phaseI],W/2,H-16,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
