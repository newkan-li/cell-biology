<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>停靠与融合两步</title><link rel="stylesheet" href="anim.css?v=20260926az"></head><body>
<script src="anim.js?v=20260926az"></script>
<script>
(function(){
  AnimKit.mount({
    title:'小泡运输的停靠与融合（两步）',
    sub:'第一步停靠：Rab 与系链蛋白把小泡拉近靶膜；第二步融合：v-SNARE/t-SNARE 拉链配对，驱动膜融合。',
    legend:[{c:'#2e9e5b',t:'Rab / 系链'},{c:'#e8703a',t:'v-SNARE'},{c:'#3b6fd6',t:'t-SNARE'}],
    init:function(S){S.vy=.20;S.tether=false;S.zip=0;S.fuse=false;},
    phases:[
      {name:'① 运输小泡接近靶膜',dur:1200,note:'运输小泡接近靶膜。',ap:function(S){S.vy=.20;S.tether=false;S.zip=0;S.fuse=false;}},
      {name:'② 停靠：Rab 与系链蛋白',dur:1300,note:'①识别、停靠锚定：运输小泡 Rab-GTP ⇔ 靶膜上的 Rab effector。',ap:function(S){S.vy=.42;S.tether=true;}},
      {name:'③ v-SNARE / t-SNARE 拉链配对',dur:1300,note:'②进一步识别、融合：运输小泡 v-SNARE ⇔ 靶膜 t-SNARE 互补配对。',ap:function(S){S.vy=.50;S.zip=1;}},
      {name:'④ 膜融合，货物释放',dur:1400,note:'③v-/t-SNARE 复合体解离：NSF + NSF 结合蛋白(SNAP)，ATP 水解；货物释放。',ap:function(S){S.vy=.60;S.fuse=true;}}
    ],
    update:function(S,e){},
    draw:function(ctx,W,H,S){
      var yT=H*.68,cx=W/2;
      ctx.fillStyle='#f7fbff';ctx.fillRect(0,0,W,yT);
      ctx.fillStyle='#eaf3fb';ctx.fillRect(0,yT,W,H-yT);
      // target membrane
      ctx.strokeStyle='#b9d2e6';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(60,yT);ctx.lineTo(W-60,yT);ctx.stroke();
      AnimKit.label(ctx,'靶膜',14,yT-14,'#7a8aa0','12px "Microsoft YaHei"','left');
      var vy=S.vy*H;
      // vesicle
      ctx.globalAlpha=S.fuse?.5:1;
      AnimKit.circle(ctx,cx,vy,42,'#8e44ad','');
      AnimKit.label(ctx,'运输小泡',cx,vy-54,'#6c3483','12px "Microsoft YaHei"');
      AnimKit.label(ctx,'货物',cx,vy+4,'#fff','11px "Microsoft YaHei"');
      ctx.globalAlpha=1;
      // Rab + tether
      if(S.tether){
        AnimKit.circle(ctx,cx-24,vy+34,10,'#2e9e5b','Rab');
        ctx.strokeStyle='#2e9e5b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx-24,vy+40);ctx.lineTo(cx-40,yT-4);ctx.stroke();
        AnimKit.label(ctx,'系链蛋白',cx-70,(vy+yT)/2,'#2e9e5b','11.5px "Microsoft YaHei"');
      }
      // SNAREs
      if(S.zip>0){
        ctx.strokeStyle='#e8703a';ctx.lineWidth=5;
        ctx.beginPath();ctx.moveTo(cx+14,vy+38);ctx.lineTo(cx+10,yT-4);ctx.stroke();
        ctx.strokeStyle='#3b6fd6';ctx.lineWidth=5;
        ctx.beginPath();ctx.moveTo(cx+24,yT+4);ctx.lineTo(cx+16,vy+40);ctx.stroke();
        AnimKit.label(ctx,'v-SNARE',cx+44,vy+18,'#e8703a','11.5px "Microsoft YaHei"','left');
        AnimKit.label(ctx,'t-SNARE',cx+44,yT+34,'#3b6fd6','11.5px "Microsoft YaHei"','left');
      }
      if(S.fuse)AnimKit.label(ctx,'膜融合 → 货物释放',cx,H-24,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
