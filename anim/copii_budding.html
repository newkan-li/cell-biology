<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COPII出芽</title><link rel="stylesheet" href="anim.css?v=20260926br"></head><body>
<script src="anim.js?v=20260926br"></script>
<script>
(function(){
  function steps(W){var m=20,g=18,n=4,bw=(W-2*m-g*(n-1))/n,by=200,bh=125,arr=[];
    for(var i=0;i<n;i++)arr.push({x:m+i*(bw+g),y:by,w:bw,h:bh});return arr;}
  AnimKit.mount({
    title:'COPII 有被小泡（ER → 高尔基体）',
    sub:'Sar-GTP 结合 ER 膜，招募 COPII 蛋白组装、出芽，将货物运往高尔基体。',
    legend:[{c:'#2e9e5b',t:'Sar-GTP'},{c:'#5a7fa8',t:'COPII 蛋白'},{c:'#e8703a',t:'货物'}],
    phases:[
      {name:'① Sar-GTP 结合 ER 膜',dur:1300,note:'COPII 有被小泡负责 ER→Golgi 运输；Sar1-GTP 结合 ER 膜。'},
      {name:'② COPII 蛋白组装',dur:1400,note:'COPII 为多亚基蛋白复合物，含 Sec23/24、Sec13/31 等。'},
      {name:'③ 出芽',dur:1400,note:'衣被蛋白在膜表面聚合，诱导高度弯曲的芽体(highly curved buds)形成。'},
      {name:'④ 与高尔基体融合',dur:1400,note:'小泡与高尔基体融合。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      var st=steps(W);AnimKit.pathway(ctx,W,H,st,phaseI);
      var a=st[phaseI],cx=a.x+a.w/2,cy=a.y+a.h/2;
      ctx.strokeStyle='#5a7fa8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-60,cy+40);ctx.lineTo(cx+60,cy+40);ctx.stroke();
      if(phaseI>=0)AnimKit.circle(ctx,cx-30,cy+40,9,'#2e9e5b','S');
      if(phaseI>=1){for(var i=0;i<4;i++)AnimKit.circle(ctx,cx-12+i*14,cy+18,6,'#5a7fa8',null);}
      if(phaseI>=2)AnimKit.circle(ctx,cx,cy-6,12,'#e8703a','货');
      AnimKit.label(ctx,'COPII 负责 ER→Golgi 顺行运输',W/2,44,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
