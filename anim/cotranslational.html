<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共翻译转移</title><link rel="stylesheet" href="anim.css?v=20260911d"></head><body>
<script src="anim.js?v=20260911d"></script>
<script>
(function(){
  function steps(W){var m=16,g=12,n=5,bw=(W-2*m-g*(n-1))/n,by=180,bh=120,arr=[];
    for(var i=0;i<n;i++)arr.push({x:m+i*(bw+g),y:by,w:bw,h:bh});return arr;}
  AnimKit.mount({
    title:'共翻译转移（信号肽假说）',
    sub:'分泌蛋白在游离核糖体起始合成，靠 N 端信号肽引导到粗面内质网，边翻译边进入 ER 腔。',
    legend:[{c:'#e8703a',t:'信号肽 / 新生肽'},{c:'#5a7fa8',t:'核糖体 / 蛋白因子'}],
    phases:[
      {name:'① 游离核糖体起始合成',dur:1300,note:'蛋白质在细胞质游离核糖体上开始合成。'},
      {name:'② N 端信号肽伸出',dur:1300,note:'肽链生长到约 80 个氨基酸，N 端信号肽伸出。'},
      {name:'③ SRP 识别结合',dur:1300,note:'信号识别颗粒(SRP)识别信号肽并结合核糖体，翻译暂停。'},
      {name:'④ 结合 SRP 受体',dur:1300,note:'SRP 与内质网膜上的 SRP 受体（停泊蛋白）结合，核糖体附着到 ER 膜。'},
      {name:'⑤ 易位子进入 ER 腔',dur:1500,note:'翻译恢复，肽链经易位子(Sec61)进入 ER 腔，信号肽被切除。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      var st=steps(W);AnimKit.pathway(ctx,W,H,st,phaseI);
      var a=st[phaseI];AnimKit.circle(ctx,a.x+a.w/2,a.y-22,10,'#e8703a','肽');
      AnimKit.label(ctx,'细胞质 → 粗面内质网 (rER)',W/2,44,'#1f5c8b','bold 15px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
