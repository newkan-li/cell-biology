<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蛋白酶体</title><link rel="stylesheet" href="anim.css?v=20260926cd"></head><body>
<script src="anim.js?v=20260926cd"></script>
<script>
(function(){
  AnimKit.mount({
    title:'26S 蛋白酶体：把泛素化蛋白切成小肽',
    sub:'带多泛素链的蛋白被送入 26S 蛋白酶体（桶状复合体），在其中被切成小肽；泛素被回收再利用。',
    legend:[{c:'#8e5bb5',t:'泛素'},{c:'#2e9e5b',t:'蛋白酶体'}],
    phases:[
      {name:'① 泛素化蛋白',dur:1400,note:'靶蛋白带多泛素链。'},
      {name:'② 送入蛋白酶体',dur:1500,note:'泛素化蛋白被识别并送入桶状蛋白酶体。'},
      {name:'③ 在桶内降解',dur:1600,note:'蛋白被切成小肽。'},
      {name:'④ 小肽与泛素释放',dur:1500,note:'小肽供再利用，泛素被回收。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'26S 蛋白酶体降解',W/2,22,'#1f5c8b','bold 14px "Microsoft YaHei"');
      var cy=H*0.5;
      // 蛋白酶体桶
      ctx.fillStyle='#c9e6d3';ctx.strokeStyle='#2e9e5b';ctx.lineWidth=2;
      AnimKit.roundRect(ctx,W*0.55,cy-56,120,112,14); ctx.fill(); ctx.stroke();
      AnimKit.label(ctx,'26S 蛋白酶体',W*0.55+60,cy+82,'#1e7a45','12px "Microsoft YaHei"');
      var inside=phaseI>=2;
      var px=inside? W*0.55+60 : W*0.28;
      AnimKit.circle(ctx,px,cy,16,'#c0392b','P');
      if(phaseI<2) for(var i=0;i<3;i++) AnimKit.circle(ctx,px-6+i*8,cy-24-i*8,6,'#8e5bb5','U');
      else for(var j=0;j<4;j++) AnimKit.circle(ctx,W*0.55+30+j*16,cy+30,5,'#c0392b',null);
      if(phaseI>=1) AnimKit.arrow(ctx,W*0.30,cy,W*0.55-2,cy,'#8aa0b8',2);
      if(phaseI>=3){ AnimKit.label(ctx,'小肽供再利用 · 泛素回收',W/2,cy+120,'#1e7a45','bold 12px "Microsoft YaHei"'); }
      AnimKit.label(ctx,['①泛素化蛋白','②送入蛋白酶体','③切成小肽','④释放/回收'][phaseI],W/2,H-10,'#1f5c8b','bold 12px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
