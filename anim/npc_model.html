<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>核孔复合体结构模型</title><link rel="stylesheet" href="anim.css?v=20260926be"></head><body>
<script src="anim.js?v=20260926be"></script>
<script>
(function(){
  AnimKit.mount({
    title:'核孔复合体（NPC）结构模型——纵向看',
    sub:'胞质环（外环，8 条短纤维）、核质环（内环，8 条长纤维末端成 60nm 核篮）、辐（辐射状八重对称）、中央运输蛋白。',
    legend:[{c:'#5a7fa8',t:'胞质环'},{c:'#7d3c98',t:'核质环/核篮'},{c:'#e8703a',t:'辐'},{c:'#c0392b',t:'中央运输蛋白'}],
    init:function(S){S.hl=0;},
    phases:[
      {name:'① 胞质环（外环）',dur:1400,note:'位于核孔边缘胞质面一侧，环上有 8 条短纤维对称分布，伸向细胞质。',ap:function(S){S.hl=0;}},
      {name:'② 核质环（内环）与核篮',dur:1500,note:'位于细胞核内侧，环上对称连有 8 条细长纤维伸向核内，纤维末端又形成一直径 60nm 的小环——核篮(fish-trap)。',ap:function(S){S.hl=1;}},
      {name:'③ 辐（spoke）',dur:1400,note:'辐由核孔边缘伸向中心，呈辐射状八重对称。',ap:function(S){S.hl=2;}},
      {name:'④ 中央运输蛋白 + 不对称',dur:1500,note:'中央运输蛋白位于核孔中心，是核质交换的主动运输载体；纵向上核质面与胞质面结构不对称。',ap:function(S){S.hl=3;}}
    ],
    draw:function(ctx,W,H,S){
      var cx=W/2,yO=H*0.36,yI=H*0.56;
      ctx.fillStyle='#f2f8ff';ctx.fillRect(0,0,W,yO-8);
      ctx.fillStyle='#eef2fb';ctx.fillRect(0,yO-8,W,yI-yO+16);
      ctx.fillStyle='#f7f2fb';ctx.fillRect(0,yI+8,W,H-yI-8);
      AnimKit.label(ctx,'胞质',14,22,'#7a8aa0','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'核质',14,H-14,'#7a8aa0','12px "Microsoft YaHei"','left');
      ctx.strokeStyle='#b9d2e6';ctx.lineWidth=6;
      ctx.beginPath();ctx.moveTo(30,yO);ctx.lineTo(cx-52,yO);ctx.moveTo(cx+52,yO);ctx.lineTo(W-30,yO);
      ctx.moveTo(30,yI);ctx.lineTo(cx-52,yI);ctx.moveTo(cx+52,yI);ctx.lineTo(W-30,yI);ctx.stroke();
      // cytoplasmic ring + 8 short filaments
      ctx.strokeStyle='#5a7fa8';ctx.lineWidth=7;
      ctx.globalAlpha=(S.hl===0||S.hl===3)?1:0.35;
      ctx.beginPath();ctx.ellipse(cx,yO-12,50,11,0,0,7);ctx.stroke();
      for(var i=0;i<8;i++){var fx=cx-44+i*12.5;ctx.beginPath();ctx.moveTo(fx,yO-16);ctx.lineTo(fx+(fx-cx)*0.08,yO-40);ctx.stroke();}
      ctx.globalAlpha=1;
      if(S.hl===0)AnimKit.label(ctx,'胞质环：8 条短纤维伸向胞质',cx+72,yO-34,'#33465c','11.5px "Microsoft YaHei"','left');
      // nuclear ring + basket
      ctx.strokeStyle='#7d3c98';ctx.lineWidth=7;
      ctx.globalAlpha=(S.hl===1||S.hl===3)?1:0.35;
      ctx.beginPath();ctx.ellipse(cx,yI+12,50,11,0,0,7);ctx.stroke();
      for(var j=0;j<8;j++){var bx=cx-44+j*12.5;ctx.beginPath();ctx.moveTo(bx,yI+16);ctx.lineTo(bx+(bx-cx)*0.25,yI+58);ctx.stroke();}
      ctx.beginPath();ctx.moveTo(cx-46,yI+58);ctx.quadraticCurveTo(cx,yI+80,cx+46,yI+58);ctx.stroke();
      ctx.globalAlpha=1;
      if(S.hl===1)AnimKit.label(ctx,'核质环 + 核篮（末端 60nm 小环）',cx+72,yI+64,'#5b2c6f','11.5px "Microsoft YaHei"','left');
      // spokes
      ctx.strokeStyle='#e8703a';ctx.lineWidth=3;
      ctx.globalAlpha=(S.hl===2||S.hl===3)?1:0.3;
      for(var s=-2;s<=2;s++){ctx.beginPath();ctx.moveTo(cx+s*18,yO-4);ctx.lineTo(cx+s*18,yI+4);ctx.stroke();}
      ctx.globalAlpha=1;
      if(S.hl===2)AnimKit.label(ctx,'辐：辐射状八重对称',cx-72,yO+6,'#a3401a','11.5px "Microsoft YaHei"','right');
      // central transporter
      ctx.globalAlpha=(S.hl===3)?1:0.3;
      ctx.fillStyle='#c0392b';ctx.fillRect(cx-11,yO-14,22,yI-yO+28);
      ctx.globalAlpha=1;
      if(S.hl===3){
        AnimKit.label(ctx,'中央运输蛋白',cx+60,yO+30,'#c0392b','11.5px "Microsoft YaHei"','left');
        AnimKit.label(ctx,'核质面 ≠ 胞质面（结构不对称）',W/2,H-10,'#c0392b','12px "Microsoft YaHei"');
      }
      AnimKit.label(ctx,'核孔复合体结构模型（纵向）',W/2,22,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
