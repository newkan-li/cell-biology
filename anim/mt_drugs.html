<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微管药物</title><link rel="stylesheet" href="anim.css?v=20260926bl"></head><body>
<script src="anim.js?v=20260926bl"></script>
<script>
(function(){
  AnimKit.mount({
    title:'微管特异性药物：紫杉醇 vs 秋水仙素/长春碱',
    sub:'紫杉醇稳定微管、抑制解聚；秋水仙素/长春碱抑制聚合、引起解聚。二者作用相反，却都使纺锤体无法正常拆装而杀伤分裂细胞。',
    legend:[{c:'#8e5bb5',t:'紫杉醇(稳定)'},{c:'#c0392b',t:'秋水仙素/长春花碱(解聚)'}],
    phases:[
      {name:'① 正常微管：动态组装/解聚',dur:1500,note:'微管的组装与解聚对纺锤体功能都至关重要。'},
      {name:'② 紫杉醇：把微管焊死',dur:1600,note:'紫杉醇促聚合、抑制解聚，微管被稳定/过度聚集。'},
      {name:'③ 长春碱：把微管拆散',dur:1600,note:'长春碱/秋水仙素抑制聚合、引起解聚，微管减少。'},
      {name:'④ 都优先杀伤分裂细胞',dur:1600,note:'纺锤体无法正常拆装→分裂细胞被卡死，用于抗癌。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'微管药物与纺锤体',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      function tube(cx,cy,n,color){ for(var i=0;i<n;i++){ ctx.strokeStyle=color; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(cx,cy-80+i*(160/Math.max(1,n-1))); ctx.lineTo(cx,cy-60+i*(160/Math.max(1,n-1))); ctx.stroke(); } }
      var cy=H/2+20;
      tube(W*0.25,cy,7,'#5a7fa8'); AnimKit.label(ctx,'正常',W*0.25,cy+110,'#45687f','12px "Microsoft YaHei"');
      tube(W*0.52,cy, phaseI>=2?14:7,'#8e5bb5'); AnimKit.label(ctx,'紫杉醇→稳定增多',W*0.52,cy+110,phaseI>=2?'#6a4a8a':'#9aa','12px "Microsoft YaHei"');
      tube(W*0.80,cy, phaseI>=3?2:7,'#c0392b'); AnimKit.label(ctx,'长春碱→解聚减少',W*0.80,cy+110,phaseI>=3?'#c0392b':'#9aa','12px "Microsoft YaHei"');
      AnimKit.label(ctx,['①正常动态','②紫杉醇稳定','③长春碱解聚','④均优先杀死分裂细胞'][phaseI],W/2,H-20,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
