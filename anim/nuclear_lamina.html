<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>核纤层</title><link rel="stylesheet" href="anim.css?v=20260926aq"></head><body>
<script src="anim.js?v=20260926aq"></script>
<script>
(function(){
  AnimKit.mount({
    title:'核纤层的动态：支撑核膜，分裂时解聚、末期重建',
    sub:'核纤层由核纤层蛋白(lamin)组成，衬在核膜内、支撑核形态；分裂前期磷酸化而解聚、核膜解体，末期去磷酸化后重建。',
    legend:[{c:'#8e5bb5',t:'核纤层(lamin)'},{c:'#5a7fa8',t:'核膜'},{c:'#c0392b',t:'染色体'}],
    phases:[
      {name:'① 间期：完整核纤层',dur:1500,note:'核纤层完整地衬在核膜内，支撑核形态。'},
      {name:'② 前期：磷酸化→解聚',dur:1600,note:'核纤层蛋白磷酸化，核纤层解聚、核膜随之崩解。'},
      {name:'③ 分裂：核膜消失',dur:1500,note:'核膜解体，染色体得以分离。'},
      {name:'④ 末期：去磷酸化→重建',dur:1600,note:'核纤层去磷酸化，重新组装、核膜重建。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'核纤层的动态变化',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var cx=W/2, cy=H/2+16, r=120;
      var intact=phaseI===0||phaseI===3;
      if(intact){ ctx.strokeStyle='#5a7fa8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
        ctx.strokeStyle='#8e5bb5';ctx.lineWidth=6;ctx.beginPath();ctx.arc(cx,cy,r-10,0,7);ctx.stroke();
        AnimKit.label(ctx,'核纤层+核膜',cx,cy-r-14,'#5a3fa0','12px "Microsoft YaHei"'); }
      else { // 解聚：碎片
        for(var i=0;i<8;i++){ var a=i/8*Math.PI*2; AnimKit.circle(ctx,cx+(r+20)*Math.cos(a),cy+(r+20)*Math.sin(a),9,'#8e5bb5',null); }
        AnimKit.label(ctx,'核纤层解聚、核膜崩解',cx,cy-r-14,'#c0392b','12px "Microsoft YaHei"'); }
      // 染色体
      if(phaseI>=1 && phaseI<3){ AnimKit.circle(ctx,cx-40,cy,16,'#c0392b',null); AnimKit.circle(ctx,cx+40,cy,16,'#c0392b',null); }
      else if(phaseI===0){ AnimKit.circle(ctx,cx,cy,16,'#c0392b',null); }
      else { AnimKit.circle(ctx,cx-40,cy,16,'#c0392b',null); AnimKit.circle(ctx,cx+40,cy,16,'#c0392b',null); }
      AnimKit.label(ctx,['①间期完整','②前期磷酸化解聚','③核膜消失','④末期去磷酸化重建'][phaseI],W/2,H-20,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
