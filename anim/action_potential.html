<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作电位</title><link rel="stylesheet" href="anim.css?v=20260926bi"></head><body>
<script src="anim.js?v=20260926bi"></script>
<script>
(function(){
  function mv(t){
    if(t<0.18)return -70;
    if(t<0.34)return AnimKit.lerp(-70,30,(t-0.18)/0.16);
    if(t<0.55)return AnimKit.lerp(30,-70,(t-0.34)/0.21);
    if(t<0.70)return AnimKit.lerp(-70,-80,(t-0.55)/0.15);
    return AnimKit.lerp(-80,-70,(t-0.70)/0.30);
  }
  AnimKit.mount({
    title:'静息电位与动作电位',
    sub:'静息时膜电位约 -70 mV；刺激后 Na⁺ 内流去极化、K⁺ 外流复极化。',
    legend:[{c:'#1f5c8b',t:'膜电位曲线'},{c:'#e8703a',t:'Na⁺ 内流'},{c:'#3b6fd6',t:'K⁺ 外流'}],
    init:function(S){S.t=0;},
    phases:[
      {name:'① 静息电位（-70 mV）',dur:1400,note:'K⁺ 泄漏通道开放、膜对 K⁺ 通透性大于 Na⁺，形成静息电位。',ap:function(S){}},
      {name:'② 去极化（Na⁺ 内流）',dur:1400,note:'刺激使电压门控 Na⁺ 通道开放，Na⁺ 大量内流，膜电位上升至约 +30 mV。',ap:function(S){}},
      {name:'③ 复极化（K⁺ 外流）',dur:1400,note:'Na⁺ 通道失活、K⁺ 通道开放，K⁺ 外流使膜电位下降。',ap:function(S){}},
      {name:'④ 超极化',dur:1200,note:'K⁺ 通道关闭较慢，膜电位短暂低于静息值。',ap:function(S){}},
      {name:'⑤ 恢复静息',dur:1200,note:'Na⁺/K⁺ 泵与离子通道恢复，膜电位回到 -70 mV。',ap:function(S){}}
    ],
    update:function(S,e){S.t+=0.010*e*3;if(S.t>1)S.t=0;},
    draw:function(ctx,W,H,S){
      var x0=70,x1=W-40,y0=H-70,y1=50;
      function px(t){return x0+(x1-x0)*t;}
      function py(mv){return y1+(y0-y1)*(40-mv)/130;}
      // axes
      ctx.strokeStyle='#dde6ee';ctx.lineWidth=1;
      [-70,0,30].forEach(function(v){ctx.beginPath();ctx.moveTo(x0,py(v));ctx.lineTo(x1,py(v));ctx.stroke();
        AnimKit.label(ctx,v+' mV',x0-8,py(v)+4,'#8aa0b8','11px Arial','right');});
      ctx.strokeStyle='#b8c6d6';ctx.beginPath();ctx.moveTo(x0,y1);ctx.lineTo(x0,y0);ctx.lineTo(x1,y0);ctx.stroke();
      AnimKit.label(ctx,'时间',x1-10,y0+22,'#8aa0b8','12px "Microsoft YaHei"','right');
      // curve up to t
      ctx.strokeStyle='#1f5c8b';ctx.lineWidth=2.5;ctx.beginPath();
      for(var i=0;i<=200;i++){var tt=S.t*i/200;var X=px(tt),Y=py(mv(tt));i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}
      ctx.stroke();
      // marker
      var X=px(S.t),Y=py(mv(S.t));
      ctx.beginPath();ctx.arc(X,Y,6,0,7);ctx.fillStyle='#c0392b';ctx.fill();
      AnimKit.label(ctx,mv(S.t).toFixed(0)+' mV',X,Y-14,'#c0392b','bold 12px Arial');
      // ion state labels
      var lab='';var col='#33465c';
      if(S.t>=0.18&&S.t<0.36){lab='Na⁺ 通道开放 → Na⁺ 内流';col='#e8703a';}
      else if(S.t>=0.36&&S.t<0.56){lab='K⁺ 通道开放 → K⁺ 外流';col='#3b6fd6';}
      else if(S.t<0.18){lab='静息：K⁺ 泄漏通道开放';}
      if(lab)AnimKit.label(ctx,lab,W/2,34,col,'bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
