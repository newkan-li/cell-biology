<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNARE融合</title><link rel="stylesheet" href="anim.css?v=20260911d"></head><body>
<script src="anim.js?v=20260911d"></script>
<script>
(function(){
  function steps(W){var m=20,g=18,n=4,bw=(W-2*m-g*(n-1))/n,by=195,bh=125,arr=[];
    for(var i=0;i<n;i++)arr.push({x:m+i*(bw+g),y:by,w:bw,h:bh});return arr;}
  AnimKit.mount({
    title:'SNARE 介导的小泡停靠与融合',
    sub:'Rab 引导小泡到正确靶膜；v-SNARE 与 t-SNARE 配对，驱动膜融合。',
    legend:[{c:'#2e9e5b',t:'v-SNARE（小泡）'},{c:'#e8703a',t:'t-SNARE（靶膜）'},{c:'#1f5c8b',t:'Rab'}],
    phases:[
      {name:'① 小泡携带 v-SNARE',dur:1200,note:'运输小泡表面有 v-SNARE，并有 Rab-GTP。'},
      {name:'② 靶膜有 t-SNARE',dur:1200,note:'靶膜上有互补的 t-SNARE 和 Rab 效应器。'},
      {name:'③ 配对（反式 SNARE）',dur:1400,note:'Rab 引导停靠；v-SNARE 与 t-SNARE 配对形成反式 SNARE 复合物。'},
      {name:'④ 膜融合',dur:1400,note:'SNARE 缠绕拉近两膜，驱动融合，内容物释放。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      var st=steps(W);AnimKit.pathway(ctx,W,H,st,phaseI);
      var a=st[phaseI],cx=a.x+a.w/2,cy=a.y+a.h/2;
      // vesicle
      ctx.strokeStyle='#2e9e5b';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy-24,26,0,Math.PI*2);ctx.stroke();
      AnimKit.circle(ctx,cx-14,cy-4,5,'#2e9e5b','v');
      // target membrane
      ctx.strokeStyle='#e8703a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-50,cy+34);ctx.lineTo(cx+50,cy+34);ctx.stroke();
      AnimKit.circle(ctx,cx+14,cy+34,5,'#e8703a','t');
      if(phaseI>=2){AnimKit.circle(ctx,cx-30,cy-46,8,'#1f5c8b','R');}
      if(phaseI>=3){ctx.fillStyle='rgba(46,158,91,.18)';ctx.beginPath();ctx.arc(cx,cy+6,34,0,Math.PI*2);ctx.fill();}
      AnimKit.label(ctx,'Rab 引导停靠；SNARE 催化膜融合（2013 诺贝尔奖）',W/2,44,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
