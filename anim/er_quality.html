<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ER质量监控</title><link rel="stylesheet" href="anim.css?v=20260926bo"></head><body>
<script src="anim.js?v=20260926bo"></script>
<script>
(function(){
  function steps(W){var m=20,g=18,n=4,bw=(W-2*m-g*(n-1))/n,by=200,bh=125,arr=[];
    for(var i=0;i<n;i++)arr.push({x:m+i*(bw+g),y:by,w:bw,h:bh});return arr;}
  AnimKit.mount({
    title:'内质网的蛋白质质量监控（ERAD）',
    sub:'只有正确折叠和装配的蛋白才能离开 ER；错误折叠蛋白经 ERAD→泛素化→26S 蛋白酶体降解。',
    legend:[{c:'#5a7fa8',t:'新生肽'},{c:'#2e9e5b',t:'分子伴侣 Bip'},{c:'#c0392b',t:'泛素 / 蛋白酶体'}],
    phases:[
      {name:'① 新生肽进入 ER',dur:1300,note:'新生肽进入 ER。'},
      {name:'② Bip 帮助折叠',dur:1400,note:'正确折叠：无需帮助，或需分子伴侣帮助。'},
      {name:'③ 正确折叠 → 输出',dur:1400,note:'错误折叠：被蛋白酶体降解。'},
      {name:'④ 错误折叠 → ERAD 降解',dur:1500,note:'或形成蛋白聚集体(protein aggregate)；随时间推移被分选处理。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      var st=steps(W);AnimKit.pathway(ctx,W,H,st,phaseI);
      var a=st[phaseI],cx=a.x+a.w/2,cy=a.y+a.h/2;
      ctx.strokeStyle='#5a7fa8';ctx.lineWidth=3;ctx.beginPath();
      for(var i=0;i<=20;i++){var x=cx-34+i*3.4,y=cy+Math.sin(i*(phaseI===3?1.4:0.4))*12;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);}ctx.stroke();
      if(phaseI===1){AnimKit.circle(ctx,cx-34,cy-26,11,'#2e9e5b','B');AnimKit.circle(ctx,cx+34,cy-26,11,'#2e9e5b','B');}
      if(phaseI===3){for(var k=0;k<3;k++)AnimKit.circle(ctx,cx-20+k*14,cy-30,6,'#c0392b','U');
        AnimKit.label(ctx,'→ 26S 蛋白酶体',cx,cy+52,'#c0392b','12px "Microsoft YaHei"');}
      if(phaseI===2)AnimKit.label(ctx,'✓ 允许离开 ER → 高尔基体',cx,cy+52,'#2e9e5b','12px "Microsoft YaHei"');
      AnimKit.label(ctx,'ER 质量监控：只有正确折叠的蛋白才能离开 ER',W/2,44,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
