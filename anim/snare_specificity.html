<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNARE 的特异性</title><link rel="stylesheet" href="anim.css?v=20260926ag"></head><body>
<script src="anim.js?v=20260926ag"></script>
<script>
(function(){
  AnimKit.mount({
    title:'SNARE 的特异性：v-/t-SNARE 互补配对',
    sub:'运输小泡的 v-SNARE 只与正确靶膜的 t-SNARE 配对，保证小泡只与正确的膜融合。',
    legend:[{c:'#3b6fd6',t:'v-SNARE'},{c:'#e8703a',t:'t-SNARE'},{c:'#2e9e5b',t:'配对融合'}],
    init:function(S){},
    phases:[
      {name:'① ER 小泡带 v-SNARE',dur:1300,note:'从内质网出芽的运输小泡表面带有特异的 v-SNARE。',ap:function(){}},
      {name:'② 靶膜带 t-SNARE',dur:1300,note:'不同靶膜(高尔基体、溶酶体等)带有不同的 t-SNARE。',ap:function(){}},
      {name:'③ 只有互补的才能配对',dur:1400,note:'v-SNARE 与 t-SNARE 互补配对，形成 SNARE 复合体。',ap:function(){}},
      {name:'④ 不匹配则不融合',dur:1400,note:'不能配对的 SNARE 无法介导融合，保证运输方向专一。',ap:function(){}},
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f7fbff';ctx.fillRect(0,0,W,H);
      var cx=W*0.5,vy=H*0.26;
      // vesicle
      AnimKit.circle(ctx,cx,vy,32,'#eef4fa',null);ctx.strokeStyle='#5a7fa8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,vy,32,0,7);ctx.stroke();
      AnimKit.label(ctx,'ER 运输小泡',cx,vy-44,'#33465c','12px "Microsoft YaHei"');
      ctx.strokeStyle='#3b6fd6';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx-10,vy+30);ctx.lineTo(cx-10,vy+54);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx+10,vy+30);ctx.lineTo(cx+10,vy+54);ctx.stroke();
      AnimKit.label(ctx,'v-SNARE',cx+50,vy+44,'#1f5c8b','11.5px "Microsoft YaHei"','left');
      // correct target (Golgi)
      var gx=W*0.30,gy=H*0.78;
      AnimKit.roundRect(ctx,gx-80,gy-14,160,30,10);ctx.fillStyle='#a9d8bd';ctx.fill();
      AnimKit.label(ctx,'高尔基体 CGN',gx,gy+34,'#3d7a5a','12px "Microsoft YaHei"');
      ctx.strokeStyle='#e8703a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(gx-10,gy-14);ctx.lineTo(gx-10,gy-36);ctx.stroke();ctx.beginPath();ctx.moveTo(gx+10,gy-14);ctx.lineTo(gx+10,gy-36);ctx.stroke();
      // incorrect target (lysosome)
      var sx=W*0.74,sy=H*0.78;
      AnimKit.circle(ctx,sx,sy,34,'#e8d6f2',null);ctx.strokeStyle='#8e44ad';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,34,0,7);ctx.stroke();
      AnimKit.label(ctx,'溶酶体',sx,sy+50,'#5b2c6f','12px "Microsoft YaHei"');
      ctx.strokeStyle='#c9a0dc';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(sx-10,sy-32);ctx.lineTo(sx-10,sy-54);ctx.stroke();
      if(phaseI>=2){AnimKit.arrow(ctx,cx-16,vy+58,gx-10,gy-40,'#2e9e5b',2.5);AnimKit.label(ctx,'✓ 互补配对',(cx+gx)/2+20,(vy+gy)/2,'#2e7d32','12px "Microsoft YaHei"');}
      if(phaseI>=3){ctx.strokeStyle='#c0392b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx+30,vy+60);ctx.lineTo(sx+20,sy-40);ctx.stroke();AnimKit.label(ctx,'✗ 不匹配',sx-70,(vy+sy)/2,'#c0392b','12px "Microsoft YaHei"');}
      AnimKit.label(ctx,'SNARE 特异性保证运输方向专一',W/2,22,'#1f5c8b','bold 13.5px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
