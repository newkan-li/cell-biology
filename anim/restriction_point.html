<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>限制点</title><link rel="stylesheet" href="anim.css?v=20260926ao"></head><body>
<script src="anim.js?v=20260926ao"></script>
<script>
(function(){
  AnimKit.mount({
    title:'G1 检验点：起始点 / 限制点',
    sub:'G1 期有一个决定细胞是否进入 S 期的关键检验点：酵母称 start，哺乳动物称 restriction point（限制点）。',
    legend:[{c:'#5a7fa8',t:'G1关卡'},{c:'#2e9e5b',t:'进入S'}],
    phases:[
      {name:'① G1 期整合信号',dur:1500,note:'细胞在 G1 整合生长信号与营养状态。'},
      {name:'② 限制点决策',dur:1500,note:'通过检验点则进入 S 期，否则暂停/退出。'},
      {name:'③ 通过→进入 S 期',dur:1500,note:'通过限制点后不再依赖外界信号。'},
      {name:'④ 未通过→G0/暂停',dur:1500,note:'未通过则停顿或退出周期。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'限制点(restriction point)',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var cy=H/2+10;
      AnimKit.arrow(ctx,140,cy,320,cy,'#8aa0b8',4); AnimKit.label(ctx,'G1',230,cy-20,'#45687f','13px "Microsoft YaHei"');
      if(phaseI>=0) AnimKit.pill(ctx,320,cy-24,120,48,'#5a7fa8','限制点','#fff');
      if(phaseI>=1){ AnimKit.label(ctx,phaseI>=3?'未通过→G0/暂停':'通过→S期',W/2,cy+70,phaseI>=3?'#c0392b':'#1e7a45','bold 13px "Microsoft YaHei"'); }
      if(phaseI<3){ AnimKit.arrow(ctx,444,cy,620,cy,'#2e9e5b',4); AnimKit.label(ctx,'S',540,cy-20,'#1e7a45','13px "Microsoft YaHei"'); }
      AnimKit.label(ctx,['①整合信号','②限制点决策','③通过→S期','④未通过→G0'][phaseI],W/2,H-16,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
