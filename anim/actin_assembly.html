<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微丝装配</title><link rel="stylesheet" href="anim.css?v=20260911e"></head><body>
<script src="anim.js?v=20260911e"></script>
<script>
(function(){
  AnimKit.mount({
    title:'微丝的装配：G-actin → F-actin（有极性）',
    sub:'球形肌动蛋白(G-actin)结合 ATP 后加到微丝两端；正端(倒钩端)加得快、负端(尖头端)慢，微丝有极性。',
    legend:[{c:'#c98a3a',t:'G-actin'},{c:'#2e9e5b',t:'正端(+ 倒钩端)'},{c:'#5a7fa8',t:'负端(− 尖头端)'}],
    phases:[
      {name:'① G-actin 单体',dur:1400,note:'球形肌动蛋白单体，带 ATP 结合位点。'},
      {name:'② 成核',dur:1400,note:'几个单体正确聚集，开始成核（最慢、限速步）。'},
      {name:'③ 延长：两端加单体',dur:1600,note:'单体加到纤维两端，正端比负端快。'},
      {name:'④ 有极性的 F-actin',dur:1400,note:'形成有正、负端的微丝(肌动蛋白纤维)。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'微丝装配',W/2,38,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var cy=H/2+20;
      var n=phaseI===0?0:phaseI===1?3:phaseI===2?6:9;
      for(var i=0;i<n;i++){ AnimKit.circle(ctx,W/2-((n-1)/2)*30+i*30,cy,13,'#c98a3a','A'); }
      if(n>0){ AnimKit.label(ctx,'(+) 倒钩端',W/2+((n-1)/2)*30+34,cy-26,'#2e9e5b','bold 12px "Microsoft YaHei"','left');
        AnimKit.label(ctx,'(−) 尖头端',W/2-((n-1)/2)*30-34,cy-26,'#5a7fa8','bold 12px "Microsoft YaHei"','right');
        AnimKit.arrow(ctx,W/2-((n-1)/2)*30-30,cy+30,W/2-((n-1)/2)*30-70,cy+30,'#5a7fa8',2);
        AnimKit.arrow(ctx,W/2+((n-1)/2)*30+30,cy+30,W/2+((n-1)/2)*30+70,cy+30,'#2e9e5b',2); }
      if(phaseI>=3) AnimKit.label(ctx,'有极性：两端装配速率不同',W/2,H-20,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
