<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信号类型</title><link rel="stylesheet" href="anim.css?v=20260926av"></head><body>
<script src="anim.js?v=20260926av"></script>
<script>
(function(){
  AnimKit.mount({
    title:'化学信号的四种作用方式',
    sub:'内分泌(激素经血远距离)、旁分泌(局部介质)、神经递质/化学突触(点对点)、自分泌(作用于自身)。',
    legend:[{c:'#5a7fa8',t:'信号细胞'},{c:'#2e9e5b',t:'靶细胞'}],
    phases:[
      {name:'① 内分泌',dur:1500,note:'激素分泌入血、广泛运送全身。'},
      {name:'② 旁分泌',dur:1500,note:'局部介质只作用于周围细胞。'},
      {name:'③ 神经递质/突触',dur:1500,note:'神经末梢释放，作用近、快、精确。'},
      {name:'④ 自分泌',dur:1500,note:'作用于自身或同类细胞，常见于癌细胞。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'化学信号的四种作用方式',W/2,22,'#1f5c8b','bold 14px "Microsoft YaHei"');
      var bw=W*0.45, bh=118, L=W*0.03, R=W*0.52, T1=42, T2=T1+bh+16;
      function S(x,y){ AnimKit.circle(ctx,x,y,12,'#5a7fa8','S'); }
      function Tg(x,y,r){ AnimKit.circle(ctx,x,y,r||11,'#2e9e5b','T'); }
      function panel(x,y,idx,label,draw){
        var on=(phaseI===idx);
        ctx.fillStyle=on?'#eef7f0':'#f7fafd'; ctx.strokeStyle=on?'#2e9e5b':'#d6e2ee'; ctx.lineWidth=on?2:1;
        AnimKit.roundRect(ctx,x,y,bw,bh,10); ctx.fill(); ctx.stroke();
        AnimKit.label(ctx,(idx+1)+'. '+label,x+12,y+18,on?'#1e7a45':'#5b6b7b',(on?'bold ':'')+'13px "Microsoft YaHei"','left');
        draw(x,y);
      }
      panel(L,T1,0,'内分泌',function(x,y){ S(x+30,y+70); for(var i=0;i<3;i++) Tg(x+bw-40-i*46,y+92,10); ctx.strokeStyle='#8e5bb5';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+30,y+82);ctx.lineTo(x+bw-24,y+92);ctx.stroke(); AnimKit.label(ctx,'经血液→全身',x+40,y+52,'#6a4a8a','11px "Microsoft YaHei"','left'); });
      panel(R,T1,1,'旁分泌',function(x,y){ S(x+30,y+70); Tg(x+90,y+56,10); Tg(x+90,y+90,10); AnimKit.arrow(ctx,x+42,y+70,x+78,y+58,'#c0392b',2); AnimKit.arrow(ctx,x+42,y+70,x+78,y+88,'#c0392b',2); AnimKit.label(ctx,'只作用周围细胞',x+40,y+112,'#45687f','11px "Microsoft YaHei"','left'); });
      panel(L,T2,2,'神经递质/突触',function(x,y){ S(x+30,y+64); Tg(x+130,y+64,12); AnimKit.arrow(ctx,x+42,y+64,x+116,y+64,'#c0392b',2.5); AnimKit.label(ctx,'突触(近·快·精确)',x+40,y+100,'#45687f','11px "Microsoft YaHei"','left'); });
      panel(R,T2,3,'自分泌',function(x,y){ var sx=x+70, sy=y+70; S(sx,sy);
        ctx.strokeStyle='#c0392b';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(sx,sy,26,-2.7,-0.5);ctx.stroke();
        var ax=sx+Math.cos(-0.5)*26, ay=sy+Math.sin(-0.5)*26, bx=sx+Math.cos(-0.2)*26, by=sy+Math.sin(-0.2)*26;
        AnimKit.arrow(ctx,ax,ay,bx,by,'#c0392b',2.5);
        AnimKit.label(ctx,'作用于自身/同类',x+118,y+104,'#c0392b','11px "Microsoft YaHei"','left'); });
      AnimKit.label(ctx,['①内分泌(经血全身)','②旁分泌(局部)','③神经递质(点对点)','④自分泌(自身)'][phaseI],W/2,H-8,'#1f5c8b','bold 12px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
