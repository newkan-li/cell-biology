<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>线粒体基质蛋白导入</title><link rel="stylesheet" href="anim.css?v=20260926bu"></head><body>
<script src="anim.js?v=20260926bu"></script>
<script>
(function(){
  function prot(ctx,x,y,col){ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();for(var i=0;i<=16;i++){var t=i/16,xx=x-16+t*32,yy=y+Math.sin(t*8)*5;if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);}ctx.stroke();}
  AnimKit.mount({
    title:'蛋白进入线粒体基质',
    sub:'含导肽的前体蛋白在胞质由 Hsp70 维持解析叠 → 经 TOM/TIM23 → 基质 Hsp70 与 ATP 驱动 → 导肽切除。',
    legend:[{c:'#3b6fd6',t:'前体蛋白'},{c:'#2e9e5b',t:'Hsp70'},{c:'#c0392b',t:'TOM/TIM'}],
    init:function(S){S.prog=0;},
    phases:[
      {name:'① 前体蛋白 + 胞质 Hsp70',dur:1400,note:'前体蛋白含 N 端导肽，在胞质由 Hsp70 结合、维持解析叠。',ap:function(S){S.prog=0;}},
      {name:'② 与 TOM 受体结合',dur:1300,note:'前体蛋白的导肽先与线粒体外膜的 TOM 受体识别结合。',ap:function(S){S.prog=0;}},
      {name:'③ 经 TIM23 进入基质',dur:1500,note:'经 TOM/TIM23 进入基质，基质 Hsp70 结合肽链、由 ATP 驱动拉动其进入。',ap:function(S){S.prog=0;}},
      {name:'④ 导肽切除、折叠成熟',dur:1300,note:'进入基质后导肽被切除，蛋白折叠成成熟形式。',ap:function(S){S.prog=0;}},
    ],
    update:function(S,e){S.prog=Math.min(1,S.prog+e*0.03);},
    draw:function(ctx,W,H,S,fc,phaseI){
      var yO=H*0.40,yI=H*0.64,cx=W*0.42;
      ctx.fillStyle='#f2f8ff';ctx.fillRect(0,0,W,yO-8);ctx.fillStyle='#fdeee0';ctx.fillRect(0,yI+8,W,H-yI-8);
      AnimKit.label(ctx,'胞质',14,20,'#7a8aa0','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'基质',14,H-12,'#a9781f','12px "Microsoft YaHei"','left');
      ctx.fillStyle='#e8c98f';ctx.fillRect(0,yO-8,W,16);ctx.fillRect(0,yI-8,W,16);
      AnimKit.roundRect(ctx,cx-70,yO-24,60,32,8);ctx.fillStyle='#c0392b';ctx.fill();AnimKit.label(ctx,'TOM',cx-40,yO+34,'#a3301f','12px "Microsoft YaHei"');
      AnimKit.roundRect(ctx,cx-70,yI-16,60,32,8);ctx.fillStyle='#7d3c98';ctx.fill();AnimKit.label(ctx,'TIM23',cx-40,yI+40,'#5b2c6f','12px "Microsoft YaHei"');
      var py;
      if(phaseI===0)py=yO-70;
      else if(phaseI===1)py=AnimKit.lerp(yO-70,yO-30,AnimKit.easeOut(S.prog));
      else if(phaseI===2)py=AnimKit.lerp(yO-30,yI+40,AnimKit.easeOut(S.prog));
      else py=yI+40;
      prot(ctx,cx-40,py,'#3b6fd6');
      AnimKit.label(ctx,'导肽',cx-62,py,'#1f5c8b','10.5px "Microsoft YaHei"','right');
      if(phaseI>=0)AnimKit.circle(ctx,cx-84,py+16,9,'#2e9e5b','H');
      if(phaseI>=2)AnimKit.circle(ctx,cx-40,py+34,9,'#2e9e5b','H');
      AnimKit.label(ctx,'Hsp70',cx-100,py+32,'#3d7a5a','10.5px "Microsoft YaHei"','right');
      if(phaseI>=3)AnimKit.label(ctx,'导肽切除 → 成熟蛋白',cx+40,py,'#2e7d32','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'线粒体基质蛋白的导入',W/2,22,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
