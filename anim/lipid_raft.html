<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脂筏</title><link rel="stylesheet" href="anim.css?v=20260926by"></head><body>
<script src="anim.js?v=20260926by"></script>
<script>
(function(){
  AnimKit.mount({
    title:'脂筏（lipid raft）',
    sub:'膜上富含胆固醇与鞘脂的有序微区，聚集特定蛋白，参与信号转导和物质运输。',
    legend:[{c:'#8e44ad',t:'胆固醇'},{c:'#2e9e5b',t:'鞘脂'},{c:'#3b6fd6',t:'脂筏蛋白'}],
    init:function(S){},
    phases:[
      {name:'① 膜是流动的',dur:1300,note:'质膜整体是流动的脂双层，脂质和蛋白可侧向扩散。',ap:function(){}},
      {name:'② 富含胆固醇/鞘脂的有序微区',dur:1400,note:'膜上局部富含胆固醇和鞘脂，排列更有序、更厚，形成“脂筏”。',ap:function(){}},
      {name:'③ 聚集特定蛋白',dur:1300,note:'脂筏上聚集 GPI 锚定蛋白、信号分子等特定蛋白。',ap:function(){}},
      {name:'④ 功能：信号转导与运输',dur:1400,note:'脂筏作为信号转导的平台，也参与物质运输和膜泡形成。',ap:function(){}},
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f7fbff';ctx.fillRect(0,0,W,H);
      var y0=H*0.44,y1=H*0.64,cx=W/2;
      // disordered membrane
      ctx.fillStyle='#ffe9c9';ctx.fillRect(0,y0,W,y1-y0);
      for(var x=8;x<W;x+=16){ctx.fillStyle='#f2b950';ctx.beginPath();ctx.arc(x,y0+4,3,0,7);ctx.fill();ctx.beginPath();ctx.arc(x,y1-4,3,0,7);ctx.fill();}
      var on=phaseI>=1;
      // raft patch (thicker)
      ctx.globalAlpha=on?1:0.25;
      ctx.fillStyle='#e8d6f2';ctx.fillRect(cx-110,y0-6,220,y1-y0+12);
      for(var rx=cx-100;rx<cx+110;rx+=18){
        AnimKit.circle(ctx,rx,y0+2,4,'#8e44ad',null);AnimKit.circle(ctx,rx,y1-2,4,'#8e44ad',null);
        ctx.fillStyle='#2e9e5b';ctx.fillRect(rx-3,y0+8,6,10);ctx.fillRect(rx-3,y1-18,6,10);
      }
      ctx.globalAlpha=1;
      if(phaseI>=2){AnimKit.roundRect(ctx,cx-60,y0-40,32,24,6);ctx.fillStyle='#3b6fd6';ctx.fill();AnimKit.roundRect(ctx,cx+20,y0-40,32,24,6);ctx.fillStyle='#3b6fd6';ctx.fill();AnimKit.label(ctx,'脂筏蛋白',cx+70,y0-28,'#1f5c8b','11.5px "Microsoft YaHei"','left');}
      if(phaseI===0)AnimKit.label(ctx,'流动的脂双层',cx,y0-16,'#33465c','12px "Microsoft YaHei"');
      if(phaseI===1)AnimKit.label(ctx,'脂筏：富含胆固醇/鞘脂的有序微区',cx,y0-16,'#5b2c6f','12px "Microsoft YaHei"');
      if(phaseI>=3)AnimKit.label(ctx,'信号转导平台 · 物质运输',cx,y1+30,'#2e7d32','bold 12.5px "Microsoft YaHei"');
      AnimKit.label(ctx,'脂筏（lipid raft）',W/2,22,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
