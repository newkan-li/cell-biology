<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>端粒缩短</title><link rel="stylesheet" href="anim.css?v=20260926bp"></head><body>
<script src="anim.js?v=20260926bp"></script>
<script>
(function(){
  AnimKit.mount({
    title:'体细胞端粒酶被抑制，端粒随分裂缩短→衰老',
    sub:'生殖细胞/干细胞端粒酶活性高；多数体细胞端粒酶被关闭，端粒每分裂缩短一段，缩到阈值即触发衰老（p53→p21→周期阻滞）。',
    legend:[{c:'#2e9e5b',t:'端粒'},{c:'#c0392b',t:'编码区'}],
    phases:[
      {name:'① 体细胞端粒酶被抑制',dur:1500,note:'体细胞端粒酶活性极低或被关闭。'},
      {name:'② 每分裂端粒缩短',dur:1500,note:'端粒随分裂次数逐渐变短。'},
      {name:'③ 缩短到阈值',dur:1600,note:'端粒短到一定程度。'},
      {name:'④ 触发衰老',dur:1500,note:'p53→p21→周期阻滞→细胞衰老。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'端粒缩短与衰老',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var y=H/2+10;
      var tel=[120,80,40,16][phaseI]; var x1=W-120;
      ctx.strokeStyle='#c0392b';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(120,y);ctx.lineTo(x1-60,y);ctx.stroke();
      ctx.strokeStyle='#2e9e5b';ctx.beginPath();ctx.moveTo(x1-60,y);ctx.lineTo(x1-60+tel,y);ctx.stroke();
      AnimKit.label(ctx,'端粒',x1-60+tel/2,y+26,'#1e7a45','12px "Microsoft YaHei"');
      AnimKit.label(ctx,'编码区',W/2-40,y-24,'#c0392b','12px "Microsoft YaHei"');
      if(phaseI>=3){ AnimKit.label(ctx,'p53→p21→周期阻滞→衰老',W/2,y+70,'#c0392b','bold 13px "Microsoft YaHei"'); }
      AnimKit.label(ctx,['①体细胞端粒酶抑制','②每分裂缩短','③到阈值','④触发衰老'][phaseI],W/2,H-16,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
