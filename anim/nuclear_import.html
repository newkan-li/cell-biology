<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>核孔运输</title><link rel="stylesheet" href="anim.css?v=20260926ao"></head><body>
<script src="anim.js?v=20260926ao"></script>
<script>
(function(){
  function steps(W){var m=14,g=10,n=5,bw=(W-2*m-g*(n-1))/n,by=195,bh=125,arr=[];
    for(var i=0;i<n;i++)arr.push({x:m+i*(bw+g),y:by,w:bw,h:bh});return arr;}
  AnimKit.mount({
    title:'核孔运输（亲核蛋白入核）',
    sub:'亲核蛋白的 NLS 被 importin 识别，经核孔复合体入核，核内 Ran-GTP 使其释放货物。',
    legend:[{c:'#5a7fa8',t:'亲核蛋白'},{c:'#e8703a',t:'NLS / importin'},{c:'#2e9e5b',t:'Ran-GTP'}],
    phases:[
      {name:'① 亲核蛋白带 NLS',dur:1200,note:'基本概念：核蛋白、核定位信号(NLS)、核输出信号(NES)、输入蛋白(importin)、输出蛋白(exportin)。'},
      {name:'② importin 识别结合',dur:1300,note:'importin 识别结合 NLS。'},
      {name:'③ 经 NPC 入核',dur:1400,note:'经 NPC 入核。'},
      {name:'④ Ran-GTP 释放货物',dur:1400,note:'Ran-GTP 使货物释放。'},
      {name:'⑤ importin 回收',dur:1300,note:'importin 回收。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      var st=steps(W);AnimKit.pathway(ctx,W,H,st,phaseI);
      var a=st[phaseI],cx=a.x+a.w/2,cy=a.y+a.h/2;
      // nuclear envelope
      ctx.strokeStyle='#5a7fa8';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(cx-58,cy-30);ctx.lineTo(cx-14,cy-30);ctx.moveTo(cx+14,cy-30);ctx.lineTo(cx+58,cy-30);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx-58,cy+30);ctx.lineTo(cx-14,cy+30);ctx.moveTo(cx+14,cy+30);ctx.lineTo(cx+58,cy+30);ctx.stroke();
      AnimKit.label(ctx,'核孔 NPC',cx,cy,'#1f5c8b','bold 11px "Microsoft YaHei"');
      AnimKit.circle(ctx,cx-26,cy-44,11,'#5a7fa8','蛋');
      AnimKit.label(ctx,'NLS',cx-26+26,cy-56,'#e8703a','bold 11px Arial');
      if(phaseI>=1)AnimKit.circle(ctx,cx-4,cy-44,10,'#e8703a','I');
      if(phaseI>=3)AnimKit.circle(ctx,cx+28,cy+40,10,'#2e9e5b','Ran');
      AnimKit.label(ctx,'NLS/importin/Ran-GTP（核质双向运输）',W/2,44,'#1f5c8b','bold 14px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
