<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肌丝滑动</title><link rel="stylesheet" href="anim.css?v=20260926ak"></head><body>
<script src="anim.js?v=20260926ak"></script>
<script>
(function(){
  AnimKit.mount({
    title:'肌肉收缩：肌丝滑动模型',
    sub:'Ca²⁺ 结合肌钙蛋白解除原肌球蛋白对 actin 的抑制，myosin 拉动细肌丝向肌节中央滑动，肌节缩短而肌丝长度不变。',
    legend:[{c:'#c98a3a',t:'细肌丝(actin)'},{c:'#2e9e5b',t:'粗肌丝(myosin II)'},{c:'#5a7fa8',t:'Z盘'}],
    phases:[
      {name:'① 静息：Tm 挡住结合位点',dur:1500,note:'原肌球蛋白(Tm)遮挡 actin 的结合位点，myosin 无法结合。'},
      {name:'② Ca²⁺ 结合 Tn 解除抑制',dur:1500,note:'肌质网释放 Ca²⁺，Ca²⁺-Tn 使 Tm 移位、露出位点。'},
      {name:'③ myosin 拉动细肌丝',dur:1800,note:'myosin 头部结合并拉动细肌丝向肌节中央滑动。'},
      {name:'④ 肌节缩短',dur:1500,note:'肌节(Z盘间距)缩短，肌肉收缩；肌丝本身长度不变。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'肌丝滑动模型',W/2,22,'#1f5c8b','bold 14px "Microsoft YaHei"');
      var cy=H*0.52, half=[230,230,185,150][phaseI]||230, cx=W/2;
      var lz=cx-half, rz=cx+half;
      // Z盘
      ctx.strokeStyle='#5a7fa8';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(lz,cy-64);ctx.lineTo(lz,cy+64);ctx.moveTo(rz,cy-64);ctx.lineTo(rz,cy+64);ctx.stroke();
      AnimKit.label(ctx,'Z盘',lz,cy+82,'#45687f','11px "Microsoft YaHei"'); AnimKit.label(ctx,'Z盘',rz,cy+82,'#45687f','11px "Microsoft YaHei"');
      // 细肌丝
      var thin=Math.min(half-34,120);
      ctx.strokeStyle='#c98a3a';ctx.lineWidth=5;
      [-22,0,22].forEach(function(o){ ctx.beginPath();ctx.moveTo(lz+4,cy+o);ctx.lineTo(lz+4+thin,cy+o);ctx.stroke();
        ctx.beginPath();ctx.moveTo(rz-4,cy+o);ctx.lineTo(rz-4-thin,cy+o);ctx.stroke(); });
      AnimKit.label(ctx,'细肌丝(actin)',lz+8,cy-72,'#a9742e','11px "Microsoft YaHei"','left');
      // 粗肌丝
      ctx.strokeStyle='#2e9e5b';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(cx-70,cy);ctx.lineTo(cx+70,cy);ctx.stroke();
      for(var i=-2;i<=2;i++){ AnimKit.circle(ctx,cx+i*30,cy-13,6,'#2e9e5b',null); AnimKit.circle(ctx,cx+i*30,cy+13,6,'#2e9e5b',null); }
      AnimKit.label(ctx,'粗肌丝(myosin II)',cx,cy+82,'#1e7a45','11px "Microsoft YaHei"');
      if(phaseI>=2){ AnimKit.arrow(ctx,cx-80,cy-38,cx-30,cy-38,'#2e9e5b',2.5); AnimKit.arrow(ctx,cx+80,cy-38,cx+30,cy-38,'#2e9e5b',2.5); AnimKit.label(ctx,'细肌丝向中央滑动',cx,cy-48,'#1e7a45','11px "Microsoft YaHei"'); }
      AnimKit.label(ctx,['①Tm 挡住位点','②Ca²⁺解除抑制','③myosin 拉动细肌丝','④肌节缩短(肌丝长度不变)'][phaseI],W/2,H-10,'#1f5c8b','bold 12px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
