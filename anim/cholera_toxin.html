<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>霍乱毒素</title><link rel="stylesheet" href="anim.css?v=20260926ad"></head><body>
<script src="anim.js?v=20260926ad"></script>
<script>
(function(){
  AnimKit.mount({
    title:'霍乱毒素：让 G 蛋白开关“卡在开”',
    sub:'霍乱毒素进入小肠上皮细胞，使 Gs 的 α 亚基 ADO-核糖化，抑制其 GTPase 活性 → GTP 不能水解、G 蛋白持续活化 → 腺苷酸环化酶一直开、cAMP 暴涨 → 大量 Na⁺/水外流，剧烈腹泻。',
    legend:[{c:'#c0392b',t:'霍乱毒素'},{c:'#2e9e5b',t:'Gs持续活化'},{c:'#5a7fa8',t:'cAMP暴涨'}],
    phases:[
      {name:'① 毒素进入上皮细胞',dur:1500,note:'霍乱毒素进入小肠上皮细胞。'},
      {name:'② 使 G 蛋白核糖化',dur:1600,note:'毒素使 α 亚基 ADP-核糖化，抑制 GTPase。'},
      {name:'③ G 蛋白持续活化',dur:1600,note:'GTP 不能水解，G 蛋白一直处于“开”。'},
      {name:'④ cAMP 暴涨→腹泻',dur:1600,note:'腺苷酸环化酶永久活化，cAMP 增加百倍，水和 Na⁺ 外流。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'霍乱毒素与 G 蛋白',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var cy=H/2+10, cx=W*0.32;
      AnimKit.circle(ctx,cx,cy,20, phaseI>=2?'#2e9e5b':'#9ad3a8', 'G');
      AnimKit.label(ctx, phaseI>=2?'GTP 不能水解 → 持续开':'GDP↔GTP 正常', cx, cy+46, phaseI>=2?'#c0392b':'#1e7a45','12px "Microsoft YaHei"');
      if(phaseI>=1){ AnimKit.circle(ctx,cx-46,cy-30,12,'#c0392b','T'); AnimKit.arrow(ctx,cx-34,cy-26,cx-16,cy-10,'#c0392b',2.5); AnimKit.label(ctx,'ADP-核糖化',cx-90,cy-40,'#c0392b','12px "Microsoft YaHei"','right'); }
      if(phaseI>=3){ AnimKit.pill(ctx,W*0.62,cy-22,150,44,'#5a7fa8','腺苷酸环化酶','#fff'); AnimKit.arrow(ctx,cx+22,cy,W*0.62-6,cy,'#2e9e5b',2.5);
        for(var i=0;i<5;i++) AnimKit.circle(ctx,W*0.62+40+i*30,cy+60,10,'#5a7fa8','c');
        AnimKit.label(ctx,'cAMP ↑100倍 → Na⁺/水外流 → 腹泻',W/2,cy+120,'#c0392b','bold 13px "Microsoft YaHei"'); }
      AnimKit.label(ctx,['①毒素进入','②G蛋白核糖化','③GTP不水解→持续开','④cAMP暴涨→腹泻'][phaseI],W/2,H-16,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
