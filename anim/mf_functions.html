<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微丝功能</title><link rel="stylesheet" href="anim.css?v=20260926af"></head><body>
<script src="anim.js?v=20260926af"></script>
<script>
(function(){
  AnimKit.mount({
    title:'微丝的主要功能',
    sub:'微丝参与：维持细胞形态、细胞运动、胞质环流、胞质分裂与肌肉收缩。',
    legend:[{c:'#c98a3a',t:'微丝'}],
    phases:[
      {name:'① 维持形态与运动',dur:1400,note:'微丝支撑细胞形态并驱动细胞运动。'},
      {name:'② 胞质环流',dur:1400,note:'肌动蛋白-肌球蛋白驱动胞质定向流动。'},
      {name:'③ 胞质分裂',dur:1500,note:'收缩环把细胞缢成两个。'},
      {name:'④ 肌肉收缩',dur:1500,note:'肌动蛋白与肌球蛋白滑动产生收缩。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'微丝的功能',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var items=[['维持形态/运动','#c98a3a'],['胞质环流','#2e9e5b'],['胞质分裂','#8e5bb5'],['肌肉收缩','#c0392b']];
      items.forEach(function(o,i){ var x=W*0.25+i*W*0.18, on=(phaseI===i);
        ctx.fillStyle=on?o[1]:'#e6ecf2'; ctx.beginPath(); ctx.arc(x,H/2+10,46,0,7); ctx.fill();
        for(var k=0;k<5;k++){ ctx.strokeStyle=on?'#fff':'#bbb'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x-20,H/2-10+k*10); ctx.lineTo(x+20,H/2-10+k*10); ctx.stroke(); }
        AnimKit.label(ctx,o[0],x,H/2+80,on?o[1]:'#9aa','13px "Microsoft YaHei"'); });
      AnimKit.label(ctx,['①形态/运动','②胞质环流','③胞质分裂','④肌肉收缩'][phaseI],W/2,H-16,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
