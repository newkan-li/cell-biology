<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动力蛋白运输</title><link rel="stylesheet" href="anim.css?v=20260926bk"></head><body>
<script src="anim.js?v=20260926bk"></script>
<script>
(function(){
  AnimKit.mount({
    title:'动力蛋白(dynein)沿微管向负端运输（逆向）',
    sub:'dynein 是向微管负端(−)运动的马达蛋白；在轴突中把物质从末梢运回胞体（逆向运输）。',
    legend:[{c:'#c0392b',t:'dynein'},{c:'#5a7fa8',t:'货物'},{c:'#2e9e5b',t:'微管'}],
    phases:[
      {name:'① 尾部结合货物',dur:1400,note:'dynein 尾部结合要被运输的货物。'},
      {name:'② 结合微管',dur:1400,note:'dynein 结合微管，准备向负端移动。'},
      {name:'③ 向负端(−)行走',dur:1800,note:'水解 ATP，沿微管向负端移动。'},
      {name:'④ 逆向运输(末梢→胞体)',dur:1500,note:'在轴突中把物质从末梢运回细胞体。'}
    ],
    init:function(S){S.x=700;},
    step:function(S,dt){ if(S.x>170) S.x-=dt/1000*70; },
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'dynein：向微管负端运输',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var y=H/2+30;
      ctx.strokeStyle='#2e9e5b';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(80,y);ctx.lineTo(W-80,y);ctx.stroke();
      AnimKit.label(ctx,'(−)端',90,y-26,'#5a7fa8','bold 12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'(+)端',W-90,y-26,'#2e9e5b','bold 12px "Microsoft YaHei"','right');
      AnimKit.label(ctx,'细胞体',80,y+34,'#45687f','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'轴突末梢',W-90,y+34,'#45687f','12px "Microsoft YaHei"','right');
      var x=(phaseI>=2)?S.x:700;
      AnimKit.circle(ctx,x,y-22,10,'#c0392b','D'); AnimKit.circle(ctx,x+18,y-22,10,'#c0392b','D');
      if(phaseI>=0) AnimKit.circle(ctx,x+9,y-54,15,'#5a7fa8','C');
      AnimKit.arrow(ctx,x+9,y-30,x+9,y-52,'#c0392b',2);
      AnimKit.arrow(ctx,x-30,y+40,x-90,y+40,'#c0392b',2.5);
      AnimKit.label(ctx,'逆向运输',x-40,y+58,'#c0392b','12px "Microsoft YaHei"','right');
      AnimKit.label(ctx,['①结合货物','②结合微管','③向负端走','④末梢→胞体(逆向)'][phaseI],W/2,H-20,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
