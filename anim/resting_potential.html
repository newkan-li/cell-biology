<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>静息电位</title><link rel="stylesheet" href="anim.css?v=20260926ce"></head><body>
<script src="anim.js?v=20260926ce"></script>
<script>
(function(){
  function P(t,nx,ny){return{t:t,nx:nx,ny:ny,tnx:nx,tny:ny};}
  function set(o,x,y){o.tnx=x;o.tny=y;}
  AnimKit.mount({
    title:'静息电位（resting potential）',
    sub:'静息时质膜对 K⁺ 通透性大于 Na⁺，K⁺ 经泄漏通道外流，留下胞内负电荷 → 内负外正的静息电位。',
    legend:[{c:'#e8703a',t:'Na⁺'},{c:'#3b6fd6',t:'K⁺'},{c:'#5a7fa8',t:'K⁺ 泄漏通道 / Na⁺-K⁺ 泵'}],
    init:function(S){S.k=[P('K',.30,.60),P('K',.42,.62),P('K',.54,.60)];S.pumpOn=false;},
    phases:[
      {name:'① Na⁺/K⁺ 泵产生 K⁺ 浓度梯度',dur:1300,note:'Na⁺/K⁺ 泵把 K⁺ 泵入胞内、Na⁺ 泵出，形成胞内高 K⁺、胞外高 Na⁺ 的浓度梯度。',ap:function(S){S.pumpOn=true;set(S.k[0],.30,.60);set(S.k[1],.42,.62);set(S.k[2],.54,.60);}},
      {name:'② 静息时对 K⁺ 通透性 > Na⁺',dur:1300,note:'动物细胞质膜在静息状态下对 K⁺ 的通透性大于 Na⁺，这是产生静息电位的主要原因。',ap:function(S){S.pumpOn=true;}},
      {name:'③ K⁺ 泄漏通道开放，K⁺ 外流',dur:1400,note:'静息时特定的 K⁺ 通道（resting K⁺ channels / K⁺ leak channels）开放，K⁺ 沿通道流向胞外。',ap:function(S){set(S.k[0],.36,.18);set(S.k[1],.50,.14);set(S.k[2],.64,.18);}},
      {name:'④ 内负外正 → 静息电位',dur:1400,note:'K⁺ 外流留下胞内非平衡的负电荷，产生内负外正的静息电位；Na⁺/K⁺ 泵维持其相对恒定。',ap:function(S){set(S.k[0],.40,.12);set(S.k[1],.54,.10);set(S.k[2],.66,.14);}}
    ],
    update:function(S,e){S.k.forEach(function(o){o.nx+=(o.tnx-o.nx)*e*.5;o.ny+=(o.tny-o.ny)*e*.5;});},
    draw:function(ctx,W,H,S){
      var m=AnimKit.membrane(ctx,W,H,{gap:0});var yT=m.yTop,yB=m.yBot,cy=(yT+yB)/2;
      // K+ leak channels
      [.36,.64].forEach(function(fx){AnimKit.roundRect(ctx,fx*W-14,yT-22,28,(yB-yT)+44,8);ctx.fillStyle='#5a7fa8';ctx.fill();
        AnimKit.roundRect(ctx,fx*W-6,yT-22,12,(yB-yT)+44,5);ctx.fillStyle='#eaf3fb';ctx.fill();});
      AnimKit.label(ctx,'K⁺ 泄漏通道（开放）',W*.36,yB+50,'#33465c','11.5px "Microsoft YaHei"');
      AnimKit.label(ctx,'K⁺ 泄漏通道（开放）',W*.64,yB+50,'#33465c','11.5px "Microsoft YaHei"');
      // Na/K pump
      AnimKit.roundRect(ctx,W*.86-24,yT-22,48,(yB-yT)+44,12);ctx.fillStyle='#7a9bbd';ctx.fill();
      AnimKit.label(ctx,'Na⁺/K⁺ 泵',W*.86,yB+50,'#33465c','11.5px "Microsoft YaHei"');
      if(S.pumpOn){AnimKit.arrow(ctx,W*.86,yB+30,W*.86,yB+64,'#c0392b',2);AnimKit.label(ctx,'3Na⁺ 出 / 2K⁺ 入',W*.86,yB+78,'#c0392b','11px "Microsoft YaHei"');}
      // ions
      S.k.forEach(function(o){AnimKit.circle(ctx,o.nx*W,o.ny*H,12,'#3b6fd6','K⁺');});
      AnimKit.label(ctx,'胞外：高 Na⁺(150mM) / 低 K⁺(4mM)',14,22,'#7a8aa0','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'胞内：低 Na⁺(12mM) / 高 K⁺(140mM)',14,H-14,'#7a8aa0','12px "Microsoft YaHei"','left');
      if(S.k[0].tny<.3){
        for(var i=0;i<5;i++){AnimKit.label(ctx,'+',W*.20+i*10,yT-8,'#c0392b','bold 16px Arial');}
        for(var j=0;j<5;j++){AnimKit.label(ctx,'–',W*.20+j*10,yB+18,'#3b6fd6','bold 16px Arial');}
        AnimKit.label(ctx,'内负外正 → 静息电位',W*.62,cy,'#1f5c8b','bold 14px "Microsoft YaHei"');
      }
    }
  });
})();
</script></body></html>
