<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水通道蛋白</title><link rel="stylesheet" href="anim.css?v=20260911d"></head><body>
<script src="anim.js?v=20260911d"></script>
<script>
(function(){
  AnimKit.mount({
    title:'水通道蛋白（Aquaporin）',
    sub:'水分子经通道快速跨膜；大分子溶质被阻挡在膜外。',
    legend:[{c:'#3b9ee5',t:'H₂O'},{c:'#b04a9a',t:'溶质（大分子）'}],
    init:function(S){
      S.w=[];for(var i=0;i<10;i++)S.w.push({nx:0,ny:0,t:Math.random()});
      S.sol={x:.18,y:.05,dir:1};
      S.blocked=0;
    },
    phases:[
      {name:'① 水分子到达通道口',dur:1200,note:'水分子从细胞外到达通道口。'},
      {name:'② 快速通过通道',dur:1500,note:'水分子经通道快速进入细胞内（顺渗透压）。'},
      {name:'③ 大分子被阻挡',dur:1200,note:'比水分子大的溶质无法通过狭窄通道（直径仅 0.28 nm）。',ap:function(S){S.blocked++;}}
    ],
    update:function(S,e){
      S.w.forEach(function(o){o.t+=0.010*e*3;if(o.t>1){o.t=0;o.nx=(Math.random()-.5)*0.10;} });
      S.sol.y+=0.006*S.sol.dir*e*3; if(S.sol.y>.34)S.sol.dir=-1; if(S.sol.y<.04){S.sol.dir=1;S.sol.x=.12+Math.random()*.16;}
    },
    draw:function(ctx,W,H,S){
      var m=AnimKit.membrane(ctx,W,H,{gap:70,outLabel:'细胞外',inLabel:'细胞内'});
      var cx=W/2;
      // channel protein
      AnimKit.roundRect(ctx,cx-34,m.yTop-24,68,(m.yBot-m.yTop)+48,12);ctx.fillStyle='#5a7fa8';ctx.fill();
      AnimKit.roundRect(ctx,cx-14,m.yTop-30,28,(m.yBot-m.yTop)+60,8);ctx.fillStyle='#eaf3fb';ctx.fill();
      AnimKit.label(ctx,'水通道',cx,m.yBot+40,'#33465c','12px "Microsoft YaHei"');
      // water molecules: move top->bottom through channel
      S.w.forEach(function(o){
        var t=o.t, x=cx+o.nx*W;
        var y=AnimKit.lerp(H*0.06,H*0.94,t);
        // funnel x toward channel near membrane
        var k=Math.exp(-Math.pow((t-0.5)/0.18,2));
        x=AnimKit.lerp(x,cx,k);
        AnimKit.circle(ctx,x,y,9,'#3b9ee5','H₂O');
      });
      // solute blocked
      var sx=S.sol.x*W, sy=S.sol.y*H;
      AnimKit.circle(ctx,sx,sy,14,'#b04a9a','X');
      if(S.sol.dir===1&&sy>m.yTop-16&&Math.abs(sx-cx)>40){AnimKit.label(ctx,'✗ 太大，不能通过',sx,sy-22,'#b04a9a','12px "Microsoft YaHei"');}
    }
  });
})();
</script></body></html>
