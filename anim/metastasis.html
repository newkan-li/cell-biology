<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>癌细胞转移</title><link rel="stylesheet" href="anim.css?v=20260926ax"></head><body>
<script src="anim.js?v=20260926ax"></script>
<script>
(function(){
  AnimKit.mount({
    title:'癌细胞的浸润与转移',
    sub:'癌细胞降低黏着、分泌蛋白酶降解基质 → 侵入周围组织 → 进入血管/淋巴 → 随血流播散 → 在远处形成转移灶。',
    legend:[{c:'#c0392b',t:'癌细胞'},{c:'#5a7fa8',t:'血管'},{c:'#8e5bb5',t:'转移灶'}],
    phases:[
      {name:'① 原发灶、黏着降低',dur:1500,note:'癌细胞黏着降低、分泌蛋白酶降解细胞外基质。'},
      {name:'② 侵入周围组织',dur:1500,note:'突破基底膜，侵入邻近组织。'},
      {name:'③ 进入血管/淋巴',dur:1600,note:'进入血管或淋巴管，随循环播散。'},
      {name:'④ 远处形成转移灶',dur:1600,note:'穿出血管、在远处器官增殖形成转移灶。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'浸润与转移',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var cy=H/2+10;
      // 原发灶
      AnimKit.circle(ctx,W*0.2,cy,46,'#f2b8ae',null); AnimKit.label(ctx,'原发灶',W*0.2,cy+70,'#8a2a20','12px "Microsoft YaHei"');
      // 血管
      ctx.strokeStyle='#5a7fa8';ctx.lineWidth=22;ctx.beginPath();ctx.moveTo(W*0.4,cy+50);ctx.lineTo(W*0.85,cy+50);ctx.stroke();
      AnimKit.label(ctx,'血管/淋巴',W*0.62,cy+86,'#45687f','12px "Microsoft YaHei"');
      if(phaseI>=1){ for(var i=0;i<3;i++) AnimKit.circle(ctx,W*0.2+70+i*34,cy-10+i*22,11,'#c0392b','C'); }
      if(phaseI>=2){ AnimKit.circle(ctx,W*0.5,cy+50,10,'#c0392b','C'); AnimKit.circle(ctx,W*0.66,cy+50,10,'#c0392b','C'); }
      if(phaseI>=3){ AnimKit.circle(ctx,W*0.8,cy-30,30,'#efe4f7',null); AnimKit.circle(ctx,W*0.8,cy-30,18,'#8e5bb5',null); AnimKit.label(ctx,'转移灶',W*0.8,cy+18,'#6a4a8a','12px "Microsoft YaHei"'); }
      AnimKit.label(ctx,['①黏着降低/降解基质','②侵入组织','③入血管/淋巴','④远处形成转移灶'][phaseI],W/2,H-16,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
