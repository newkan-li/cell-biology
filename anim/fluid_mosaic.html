<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流动镶嵌模型</title><link rel="stylesheet" href="anim.css?v=20260926ag"></head><body>
<script src="anim.js?v=20260926ag"></script>
<script>
(function(){
  function lipid(ctx,x,y,down,tail){
    var d=down?1:-1;
    ctx.fillStyle='#f2b950';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();
    ctx.strokeStyle='#e6c98f';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x-2,y+d*4);ctx.quadraticCurveTo(x-2-tail*4,y+d*16,x-2-tail*6,y+d*26);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+2,y+d*4);ctx.quadraticCurveTo(x+2+tail*4,y+d*16,x+2+tail*6,y+d*26);ctx.stroke();
  }
  AnimKit.mount({
    title:'流动镶嵌模型（Singer & Nicolson, 1972）',
    sub:'磷脂双分子层为骨架，蛋白质镶嵌其中；膜具有流动性与不对称性。',
    legend:[{c:'#f2b950',t:'磷脂'},{c:'#5a7fa8',t:'整合蛋白'},{c:'#b04a9a',t:'糖基'}],
    init:function(S){S.prots=[{x:.24,w:54},{x:.53,w:72},{x:.80,w:44}];S.drift=0;S.sugar=false;},
    phases:[
      {name:'① 磷脂双分子层为骨架',dur:1200,note:'具有极性头部和非极性尾部的磷脂双分子层是组成生物膜的基本结构组分。'},
      {name:'② 蛋白质镶嵌其中',dur:1200,note:'不同的膜蛋白与膜脂双分子层的亲和性不同、作用方式不同，膜蛋白在膜脂中的位置不同。'},
      {name:'③ 膜的流动性',dur:1500,note:'脂类和蛋白质的流动性是它们相互作用及与其他生物大分子相互作用的基础。'},
      {name:'④ 相对稳定的动态结构',dur:1200,note:'这种相互作用又一定程度上限制了膜蛋白和膜脂的流动性；细胞膜是一个相对稳定的动态结构。',ap:function(S){S.sugar=true;}}
    ],
    update:function(S,e){S.drift+=0.7*e*3;},
    draw:function(ctx,W,H,S){
      var yT=H*.42,yB=H*.58,cy=(yT+yB)/2;
      ctx.fillStyle='#f2f8ff';ctx.fillRect(0,0,W,yT);
      ctx.fillStyle='#fff7ef';ctx.fillRect(0,yB,W,H-yB);
      ctx.fillStyle='#ffe9c9';ctx.fillRect(0,yT,W,yB-yT);
      for(var x=16;x<W-8;x+=24){
        var tail=Math.sin((x+S.drift)*0.05)*0.4+0.6;
        lipid(ctx,x,yT+2,true,tail);lipid(ctx,x,yB-2,false,tail);
      }
      var cols=['#5a7fa8','#3b6fd6','#5a7fa8'];
      S.prots.forEach(function(p,i){
        var px=p.x*W,w=p.w;
        AnimKit.roundRect(ctx,px-w/2,yT-26,w,(yB-yT)+52,12);ctx.fillStyle=cols[i];ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(px-w/2+6,cy-4,w-12,8);
      });
      AnimKit.label(ctx,'整合蛋白',S.prots[0].x*W,yT-34,'#33465c','11px "Microsoft YaHei"');
      AnimKit.label(ctx,'跨膜蛋白',S.prots[1].x*W,yT-34,'#33465c','11px "Microsoft YaHei"');
      AnimKit.label(ctx,'整合蛋白',S.prots[2].x*W,yT-34,'#33465c','11px "Microsoft YaHei"');
      if(S.sugar){[S.prots[0].x,S.prots[2].x].forEach(function(fx){
        var x=fx*W;ctx.strokeStyle='#b04a9a';ctx.lineWidth=2;
        for(var k=-1;k<=1;k++){ctx.beginPath();ctx.arc(x+k*7,yT-32,4,0,7);ctx.stroke();}
        AnimKit.label(ctx,'糖基',x,yT-44,'#b04a9a','11px "Microsoft YaHei"');
      });}
      AnimKit.label(ctx,'细胞外',14,22,'#7a8aa0','13px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'细胞内',14,H-14,'#7a8aa0','13px "Microsoft YaHei"','left');
    }
  });
})();
</script></body></html>
