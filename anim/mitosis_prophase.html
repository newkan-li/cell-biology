<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>前期两事件</title><link rel="stylesheet" href="anim.css?v=20260926ay"></head><body>
<script src="anim.js?v=20260926ay"></script>
<script>
(function(){
  AnimKit.mount({
    title:'有丝分裂前期的两个主要事件',
    sub:'有丝分裂前期发生两件大事：①染色体凝缩（cohesin 黏连、condensin 凝缩）；②纺锤体装配。',
    legend:[{c:'#c0392b',t:'染色体'},{c:'#2e9e5b',t:'纺锤体'}],
    phases:[
      {name:'① 染色体凝缩',dur:1500,note:'染色质高度折叠盘曲、凝缩成染色体。'},
      {name:'② cohesin/condensin 作用',dur:1500,note:'cohesin 黏连姐妹染色单体，condensin 促凝缩。'},
      {name:'③ 纺锤体装配',dur:1600,note:'中心体移向两极、微管形成纺锤体。'},
      {name:'④ 为中期排列做准备',dur:1500,note:'两事件共同使染色体能被准确分配。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'前期两事件',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var cy=H/2+10;
      if(phaseI<=1){ var w=phaseI>=1?26:8;
        AnimKit.pill(ctx,W/2-w,cy-120,w*2,240,'#c0392b', null);
        AnimKit.label(ctx,phaseI>=1?'凝缩的染色体':'细长的染色质',W/2,cy+150,'#c0392b','13px "Microsoft YaHei"');
        if(phaseI>=1) AnimKit.label(ctx,'cohesin 黏连 · condensin 凝缩',W/2,cy+178,'#6a4a8a','12px "Microsoft YaHei"'); }
      else { // 纺锤体
        AnimKit.circle(ctx,W*0.28,cy,10,'#1f5c8b',null); AnimKit.circle(ctx,W*0.72,cy,10,'#1f5c8b',null);
        for(var i=0;i<5;i++){ ctx.strokeStyle='#2e9e5b';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(W*0.28,cy);ctx.lineTo(W/2-20,cy-60+i*30);ctx.moveTo(W*0.72,cy);ctx.lineTo(W/2+20,cy-60+i*30);ctx.stroke(); }
        AnimKit.circle(ctx,W/2,cy,14,'#c0392b',null);
        AnimKit.label(ctx,'纺锤体装配',W/2,cy+150,'#1e7a45','13px "Microsoft YaHei"'); }
      AnimKit.label(ctx,['①染色体凝缩','②cohesin/condensin','③纺锤体装配','④准备中期排列'][phaseI],W/2,H-16,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
