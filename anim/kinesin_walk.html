<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>驱动蛋白行走</title><link rel="stylesheet" href="anim.css?v=20260926b"></head><body>
<script src="anim.js?v=20260926b"></script>
<script>
(function(){
  AnimKit.mount({
    title:'驱动蛋白(kinesin)沿微管向正端“行走”运输货物',
    sub:'kinesin 的两个球状头部交替结合微管，水解 ATP 供能，带着货物向微管正端(通常朝细胞周边)移动。',
    legend:[{c:'#c0392b',t:'驱动蛋白'},{c:'#5a7fa8',t:'货物'},{c:'#2e9e5b',t:'微管'}],
    phases:[
      {name:'① 尾部结合货物',dur:1400,note:'kinesin 尾部结合被运输的货物(囊泡/细胞器)。'},
      {name:'② 头部结合微管',dur:1400,note:'两个球状头部结合到微管上，准备行走。'},
      {name:'③ ATP 供能、交替迈步',dur:2000,note:'水解 ATP，两个头部交替吸附、沿微管迈步前进。'},
      {name:'④ 向正端(+端)移动',dur:1600,note:'整体向微管正端移动(顺向运输)。'}
    ],
    init:function(S){S.x=150;},
    step:function(S,dt){ if(S.x<680) S.x+=dt/1000*70; },
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'驱动蛋白向微管正端行走',W/2,22,'#1f5c8b','bold 14px "Microsoft YaHei"');
      var my=H*0.62, x=(phaseI>=2)?S.x:150;
      // 微管
      ctx.strokeStyle='#2e9e5b';ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(40,my);ctx.lineTo(W-40,my);ctx.stroke();
      AnimKit.label(ctx,'微管',60,my-24,'#1e7a45','12px "Microsoft YaHei"','left');
      AnimKit.arrow(ctx,60,my+42,240,my+42,'#2e9e5b',2.5); AnimKit.label(ctx,'(+)端',248,my+46,'#1e7a45','12px "Microsoft YaHei"','left');
      // kinesin
      var hy=my-14, off=(Math.floor(fc/10)%2)?10:0;
      for(var s=0;s<6;s++){ var fx=x-64+s*22; if(fx>70) AnimKit.circle(ctx,fx,my-26,4,'#e6b3a6',null); }
      AnimKit.circle(ctx,x-16,hy,10,'#c0392b','H');
      AnimKit.circle(ctx,x+16,hy-off,10,'#c0392b','H');
      // 颈部+尾部线到货物
      ctx.strokeStyle='#c0392b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,hy-10);ctx.lineTo(x,hy-46);ctx.stroke();
      if(phaseI>=0){ AnimKit.circle(ctx,x,hy-64,15,'#5a7fa8','C'); AnimKit.label(ctx,'货物',x,hy-92,'#45687f','11px "Microsoft YaHei"'); }
      AnimKit.label(ctx,'水解 ATP → 交替迈步 → 顺向运输',W/2,H-12,'#1f5c8b','bold 12px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
