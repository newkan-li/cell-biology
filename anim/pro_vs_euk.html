<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原核vs真核</title><link rel="stylesheet" href="anim.css?v=20260926bl"></head><body>
<script src="anim.js?v=20260926bl"></script>
<script>
(function(){
  AnimKit.mount({
    title:'原核细胞与真核细胞的比较',
    sub:'原核：无核膜、无膜被细胞器、DNA 环状裸露、70S 核糖体；真核：有细胞核、有多种膜被细胞器、DNA 与组蛋白成染色体、80S 核糖体。',
    legend:[{c:'#5a7fa8',t:'原核细胞'},{c:'#2e9e5b',t:'真核细胞'}],
    phases:[
      {name:'① 原核：无核膜、裸露 DNA',dur:1500,note:'原核无核膜、无膜被细胞器，DNA 环状裸露。'},
      {name:'② 真核：有真正的核',dur:1500,note:'真核有核膜包被的细胞核，DNA 与组蛋白成染色体。'},
      {name:'③ 膜被细胞器：无 vs 有',dur:1500,note:'原核无膜被细胞器；真核有 ER、高尔基体、线粒体等。'},
      {name:'④ 共同点与差异小结',dur:1600,note:'两者都有质膜、DNA/RNA、核糖体；差别在核与细胞器。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'原核 vs 真核',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var cy=H/2+20;
      // 原核
      AnimKit.pill(ctx,90,cy-110,220,220,'#e8f1fb','原核细胞','#45687f');
      ctx.strokeStyle='#5a7fa8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(200,cy,52,0,7);ctx.stroke();
      AnimKit.circle(ctx,200,cy,7,'#c0392b','D'); AnimKit.label(ctx,'环状DNA(裸露)',200,cy+70,'#45687f','11px "Microsoft YaHei"');
      for(var i=0;i<5;i++) AnimKit.circle(ctx,150+i*20,cy+28,4,'#8e5bb5',null);
      // 真核
      AnimKit.pill(ctx,W-310,cy-110,220,220,'#e8fbf0','真核细胞','#1e5a2a');
      ctx.strokeStyle='#2e9e5b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(W-200,cy-10,46,0,7);ctx.stroke();
      AnimKit.circle(ctx,W-200,cy-10,10,'#c0392b','N'); AnimKit.label(ctx,'细胞核(有核膜)',W-200,cy+50,'#1e7a45','11px "Microsoft YaHei"');
      AnimKit.circle(ctx,W-250,cy+50,10,'#8e5bb5',null); AnimKit.circle(ctx,W-150,cy+50,10,'#e0a95a',null); AnimKit.label(ctx,'膜被细胞器',W-200,cy+86,'#1e7a45','11px "Microsoft YaHei"');
      AnimKit.label(ctx,['①无核膜/裸露DNA','②有真核(核膜+染色体)','③膜被细胞器 无/有','④共同点：质膜/DNA/核糖体'][phaseI],W/2,H-16,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
