<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>端粒与端粒酶</title><link rel="stylesheet" href="anim.css?v=20260926al"></head><body>
<script src="anim.js?v=20260926al"></script>
<script>
(function(){
  AnimKit.mount({
    title:'端粒、末端复制问题与端粒酶',
    sub:'DNA 聚合酶不能从头合成，每次复制子链 5′端都会短一截；端粒是末端的“缓冲重复序列”，端粒酶以自身 RNA 为模板把它补回。',
    legend:[{c:'#2e9e5b',t:'端粒重复序列'},{c:'#c0392b',t:'编码区'},{c:'#8e5bb5',t:'端粒酶'}],
    phases:[
      {name:'① 染色体末端有端粒',dur:1500,note:'端粒是染色体末端的重复序列，保护编码区。'},
      {name:'② 每次复制缩短一段',dur:1600,note:'末端复制问题：子链 5′端 RNA 引物切除后缺失，端粒每分裂缩短。'},
      {name:'③ 端粒酶以 RNA 为模板延伸',dur:1700,note:'端粒酶(核糖核蛋白、逆转录酶)以自身 RNA 为模板合成端粒 DNA。'},
      {name:'④ 端粒维持/缩短与衰老',dur:1600,note:'生殖细胞/干细胞端粒酶活性高；体细胞被关闭，端粒缩短到阈值即衰老。'}
    ],
    draw:function(ctx,W,H,S,fc,phaseI){
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'端粒与端粒酶',W/2,34,'#1f5c8b','bold 15px "Microsoft YaHei"');
      var y=H/2+10, x0=90, x1=W-90;
      // 编码区
      ctx.strokeStyle='#c0392b';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x0+120,y);ctx.lineTo(x1-60,y);ctx.stroke();
      AnimKit.label(ctx,'编码区(基因)',W/2,y-24,'#c0392b','12px "Microsoft YaHei"');
      // 端粒
      var tel=[0,80,-40,40][phaseI];
      ctx.strokeStyle='#2e9e5b';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x1-60,y);ctx.lineTo(x1-60+tel,y);ctx.stroke();
      AnimKit.label(ctx,'端粒',x1-20,y+26,'#1e7a45','12px "Microsoft YaHei"');
      if(phaseI>=1) AnimKit.arrow(ctx,x1-20,y-30,x1-20+tel,y-30,'#c0392b',2.5);
      // 端粒酶
      if(phaseI>=2){ AnimKit.pill(ctx,x1-260,y-90,180,40,'#8e5bb5','端粒酶 + RNA模板','#fff');
        AnimKit.arrow(ctx,x1-170,y-46,x1-20,y-18,'#8e5bb5',2.5);
        AnimKit.label(ctx,'反转录添加 TTGGGG 重复',x1-120,y+56,'#6a4a8a','12px "Microsoft YaHei"'); }
      AnimKit.label(ctx,['①末端端粒','②每次复制缩短','③端粒酶延伸端粒','④活性决定维持/缩短→衰老'][phaseI],W/2,H-18,'#1f5c8b','bold 13px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
