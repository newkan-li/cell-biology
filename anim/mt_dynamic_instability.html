<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动态不稳定性</title><link rel="stylesheet" href="anim.css?v=20260926af"></head><body>
<script src="anim.js?v=20260926af"></script>
<script>
(function(){
  var shrinkTargets=[150,150,80,150];
  AnimKit.mount({
    title:'微管的动态不稳定性：GTP 帽 ↔ GDP 帽',
    sub:'末端结合 GTP(形成 GTP 帽)时持续聚合生长；GTP 水解为 GDP、帽丢失后转为快速解聚。生长与骤缩随机切换。',
    legend:[{c:'#2e9e5b',t:'GTP 帽(生长)'},{c:'#c0392b',t:'GDP 帽(解聚)'}],
    phases:[
      {name:'① GTP 帽：聚合生长',dur:1800,note:'末端为 GTP-微管蛋白，形成 GTP 帽，微管延长。'},
      {name:'② GTP 水解、帽丢失',dur:1800,note:'聚合速率小于水解速率时，GTP 水解为 GDP，帽丢失。'},
      {name:'③ GDP 帽：快速解聚',dur:1800,note:'失去 GTP 帽，末端迅速解聚(灾难)。'},
      {name:'④ 重新获得 GTP 帽→再生长',dur:1800,note:'重新获得 GTP 帽后恢复生长，如此反复。'}
    ],
    init:function(S){S.shrink=150;},
    step:function(S,dt){ var t=shrinkTargets[window.__p||0]||150; S.shrink += (t-S.shrink)*0.06; },
    draw:function(ctx,W,H,S,fc,phaseI){
      window.__p=phaseI;
      ctx.fillStyle='#f6f9fc';ctx.fillRect(0,0,W,H);
      AnimKit.label(ctx,'GTP 帽 ↔ GDP 帽 的切换',W/2,22,'#1f5c8b','bold 14px "Microsoft YaHei"');
      var base=H-40;
      function stack(x,len,grow){
        for(var y=base;y>base-len+4;y-=22){ AnimKit.circle(ctx,x,y,9,(Math.round((base-y)/22)%2)?'#5a7fa8':'#2e9e5b',null); }
        var top=base-len; AnimKit.circle(ctx,x,top,10, grow?'#2e9e5b':'#c0392b', grow?'G':'D');
        return top;
      }
      // 左：生长
      var lx=W*0.33, lt=stack(lx,190,true);
      AnimKit.arrow(ctx,lx,lt-8,lx,lt-44,'#2e9e5b',2.5); AnimKit.label(ctx,'聚合 ↑',lx+16,lt-30,'#1e7a45','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'GTP 帽(稳定)',lx,base+18,'#1e7a45','bold 12px "Microsoft YaHei"');
      // 右：解聚
      var rx=W*0.67, rt=stack(rx,S.shrink,false);
      AnimKit.arrow(ctx,rx,rt+44,rx,rt+10,'#c0392b',2.5); AnimKit.label(ctx,'解聚 ↓',rx+16,rt+34,'#c0392b','12px "Microsoft YaHei"','left');
      AnimKit.label(ctx,'GDP 帽(去稳定)',rx,base+18,'#c0392b','bold 12px "Microsoft YaHei"');
      var act=(phaseI===0||phaseI===3)?'左：聚合生长':'右：快速解聚';
      AnimKit.label(ctx,'当前：'+act,W/2,H-12,'#1f5c8b','bold 12px "Microsoft YaHei"');
    }
  });
})();
</script></body></html>
